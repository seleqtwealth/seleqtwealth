<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#f6f3ed" />
  <title>After Someone Dies · Draft</title>
  <link rel="icon" href="data:," />
  <meta name="description" content="Draft: a family guide to the first 100 days after someone dies." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Sans+3:wght@400;500;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Serif+Gujarati:wght@500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@500&display=swap" />
  <link rel="preload" as="image" href="/images/after/home-sm.webp" media="(max-width: 700px)" />
  <link rel="preload" as="image" href="/images/after/home.webp" media="(min-width: 701px)" />
  <style>
    /* Neutral draft (no brand kit: a new identity is in progress). Warmth comes from the photographs:
       quiet nature and sky, one per part. Journey and toolkit are the only two places. */
    :root {
      --bg: #f6f3ed; --surface: #fffdf9; --ink: #26241f; --muted: #6f695f; --line: #e6e0d5;
      --accent: #3f5d52; --accent-ink: #ffffff; --accent-soft: #e4ebe6; --hint: #f3e6c8; --shadow: 0 1px 2px rgba(38,36,31,.05), 0 10px 30px -12px rgba(38,36,31,.18);
      --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
      --sans: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --r: 16px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141614; --surface: #1c1f1c; --ink: #ebe8e1; --muted: #a39f95; --line: #2f332f;
        --accent: #9fc3b4; --accent-ink: #0f1714; --accent-soft: #22302b; --hint: #4a4126; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.6); color-scheme: dark; }
    }
    html:lang(gu) { --sans: "Noto Sans Gujarati", "Gujarati Sangam MN", "Shruti", sans-serif; --serif: "Noto Serif Gujarati", "Noto Sans Gujarati", serif; }
    html:lang(hi) { --sans: "Noto Sans Devanagari", "Kohinoor Devanagari", "Mangal", sans-serif; --serif: "Noto Serif Devanagari", "Noto Sans Devanagari", serif; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; }
    a { color: var(--accent); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.15; margin: 0; text-wrap: balance; }
    p { margin: 0 0 1em; }
    [hidden] { display: none !important; }
    svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .col { max-width: 700px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-left)); }
    .colw { max-width: 1040px; margin: 0 auto; padding: 0 max(20px, env(safe-area-inset-left)); }

    /* ── bars ── */
    .top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px max(20px, env(safe-area-inset-left)); background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
    .top .name { font: 500 1.08rem/1 var(--serif); cursor: pointer; border: 0; background: none; padding: 4px 0; }
    .draft { padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; letter-spacing: .04em; }
    .top .sp { flex: 1; }
    .tabs-top { display: flex; gap: 4px; }
    .tabs-top button, .langbtn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-size: 15px; font-weight: 500; }
    .tabs-top button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
    .langbtn { border: 1px solid var(--line); }
    .langmenu { position: absolute; right: max(20px, env(safe-area-inset-right)); top: 54px; min-width: 170px; padding: 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .langmenu button { display: flex; justify-content: space-between; width: 100%; padding: 10px 12px; border: 0; border-radius: 9px; background: none; cursor: pointer; text-align: left; }
    .langmenu button:hover { background: var(--accent-soft); }
    .langmenu button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
    .tnote { padding: 7px max(20px, env(safe-area-inset-left)); background: var(--hint); font-size: 13.5px; text-align: center; }
    .tabbar { display: none; }
    @media (max-width: 760px) {
      .tabs-top { display: none; }
      .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: 1fr 1fr; padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
      .tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; }
      .tabbar button[aria-current="page"] { color: var(--accent); }
      body { padding-bottom: calc(66px + env(safe-area-inset-bottom)); }
    }

    /* ── photo headers ── */
    .hero { position: relative; height: min(64vh, 620px); min-height: 400px; overflow: hidden; background: #3a4a44; }
    .hero.part { height: min(46vh, 440px); min-height: 280px; }
    .hero.short { height: min(30vh, 280px); min-height: 200px; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.04); animation: drift 14s ease-out forwards; }
    @keyframes drift { to { transform: scale(1); } }
    .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(20,22,20,.12) 0%, rgba(20,22,20,0) 35%, rgba(20,22,20,.55) 100%); }
    .hero .over { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding-bottom: 36px; color: #fffaf1; text-shadow: 0 1px 24px rgba(0,0,0,.35); }
    .hero h1 { font-size: clamp(2.7rem, 7.5vw, 5rem); letter-spacing: -0.015em; }
    .hero h2 { font-size: clamp(2.1rem, 5.6vw, 3.4rem); }
    .hero .sub { margin: 12px 0 0; font: 1.25rem/1.45 var(--serif); opacity: .95; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip { display: inline-block; padding: 4px 11px; border-radius: 999px; background: rgba(255,250,241,.2); border: 1px solid rgba(255,250,241,.35); color: #fffaf1; font: 600 13px/1.4 var(--sans); text-shadow: none; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }

    /* ── home ── */
    .care { position: relative; z-index: 2; margin: -26px auto 0; padding: 26px 28px; border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); font: 1.16rem/1.65 var(--serif); }
    .care p:last-child { margin: 0; }
    .start { margin: 26px 0 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 56px 0 6px; }
    .sect-h h2 { font-size: 1.9rem; }
    .sect-p { margin: 0 0 18px; color: var(--muted); }
    .parts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .partrow { display: grid; grid-template-columns: 96px 1fr auto; gap: 16px; align-items: center; width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; transition: border-color .2s, transform .2s, box-shadow .2s; }
    .partrow:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow: var(--shadow); }
    .partrow img { width: 96px; height: 72px; border-radius: 11px; object-fit: cover; }
    .partrow .when { color: var(--muted); font-size: 13.5px; font-weight: 600; }
    .partrow .t { display: block; font: 500 1.28rem/1.25 var(--serif); margin-top: 2px; }
    .partrow .pg { display: block; margin-top: 4px; color: var(--muted); font-size: 14px; }
    .partrow.now { border-color: var(--accent); }
    .partrow .done-badge { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); font-size: 14px; font-weight: 600; }
    .chev { color: var(--muted); }
    .kitrow { margin-top: 28px; }
    /* photographs fade in once they have loaded, instead of popping in */
    .hero img, .partrow img { opacity: 0; transition: opacity .8s ease; }
    .hero img.ld, .partrow img.ld { opacity: 1; }
    .item { scroll-margin: 90px 0 96px; }

    /* ── buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; cursor: pointer; text-decoration: none; transition: filter .15s, transform .15s; }
    .btn:hover { filter: brightness(1.07); }
    .btn:active { transform: scale(.98); }
    .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); font-weight: 500; }
    .btn.sm { min-height: 38px; padding: 8px 15px; font-size: 14.5px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }

    /* ── a part ── */
    .meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 22px 0 0; }
    .meter button { height: 5px; padding: 0; border: 0; border-radius: 999px; background: var(--line); cursor: pointer; }
    .meter button.on { background: var(--accent); }
    .meter button.here { background: color-mix(in srgb, var(--accent) 55%, var(--line)); }
    .brief { margin: 26px 0 26px; font: 1.3rem/1.6 var(--serif); }
    .introp { color: var(--ink); }
    .card { border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); }
    .list { margin-top: 8px; overflow: hidden; }
    .item { border-top: 1px solid var(--line); }
    .item:first-child { border-top: 0; }
    .item-h { display: grid; grid-template-columns: 34px 1fr 24px; gap: 12px; align-items: center; padding: 15px 16px; }
    .tick { width: 30px; height: 30px; border-radius: 50%; border: 1.7px solid color-mix(in srgb, var(--accent) 70%, var(--line)); background: transparent; cursor: pointer; display: grid; place-items: center; color: var(--accent-ink); transition: background .2s, border-color .2s; }
    .tick svg { width: 16px; height: 16px; opacity: 0; transition: opacity .2s; }
    .item.is-done .tick { background: var(--accent); border-color: var(--accent); }
    .item.is-done .tick svg { opacity: 1; }
    .item-t { padding: 0; border: 0; background: none; cursor: pointer; text-align: left; font-weight: 600; font-size: 16.5px; line-height: 1.35; }
    .item.is-done .item-t { color: var(--muted); }
    .item-x { padding: 0; border: 0; background: none; cursor: pointer; color: var(--muted); display: grid; place-items: center; transition: transform .25s; }
    .item.open .item-x { transform: rotate(180deg); }
    .item-b { display: none; padding: 0 16px 18px 62px; }
    .item.open .item-b { display: block; animation: rise .25s ease; }
    .item-b p { margin: 0 0 12px; }
    .linkbtn { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14.5px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
    .tile { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 118px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; }
    .tile:hover { box-shadow: var(--shadow); }
    .tile b { font: 500 1.15rem/1.25 var(--serif); }
    .pill { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 600; }
    .pill.ok { background: var(--accent-soft); color: var(--accent); }
    .tile.add { align-items: center; justify-content: center; flex-direction: row; border-style: dashed; color: var(--muted); font-weight: 600; }
    .empty { margin-top: 12px; padding: 22px; text-align: center; }
    .empty p { color: var(--muted); }
    .qs { margin-top: 36px; }
    .qs h3 { font-size: 1.35rem; margin-bottom: 10px; }
    details.q { border-top: 1px solid var(--line); }
    details.q:last-of-type { border-bottom: 1px solid var(--line); }
    details.q summary { list-style: none; cursor: pointer; padding: 15px 34px 15px 0; position: relative; font-weight: 500; }
    details.q summary::-webkit-details-marker { display: none; }
    details.q summary::after { content: ''; position: absolute; right: 6px; top: 22px; width: 9px; height: 9px; border-right: 1.7px solid var(--muted); border-bottom: 1.7px solid var(--muted); transform: rotate(45deg); transition: transform .25s; }
    details.q[open] summary::after { transform: rotate(-135deg); top: 26px; }
    details.q > div { padding: 0 0 18px; color: var(--ink); }
    .closing { margin: 34px 0 0; padding: 22px 24px; border-radius: var(--r); background: var(--accent-soft); font: italic 1.15rem/1.6 var(--serif); }
    .next { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 46px 0 70px; padding-top: 22px; border-top: 1px solid var(--line); }

    /* ── toolkit ── */
    .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin: 24px 0 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
    .seg button { padding: 9px 16px; border: 0; border-radius: 999px; background: none; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 15px; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
    .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 12px; padding: 18px; }
    .fields label { display: grid; gap: 5px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
    .fields input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: 16px var(--sans); }
    .fields-note { margin: 0; padding: 0 18px 16px; color: var(--muted); font-size: 13.5px; }
    .rowlist { margin-top: 12px; }
    .rowbtn { display: grid; grid-template-columns: 40px 1fr 20px; gap: 14px; align-items: center; width: 100%; padding: 14px 16px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; text-align: left; }
    .rowbtn:first-child { border-top: 0; }
    .rowbtn .ic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
    .rowbtn b { font-weight: 600; }
    .script { list-style: none; margin: 0; padding: 0; counter-reset: l; }
    .script li { position: relative; padding: 10px 0 10px 36px; border-top: 1px solid var(--line); font: 1.08rem/1.55 var(--serif); counter-increment: l; }
    .script li:first-child { border-top: 0; }
    .script li::before { content: counter(l); position: absolute; left: 0; top: 11px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 13px/24px var(--sans); text-align: center; }
    .callcard { padding: 18px 20px; margin-top: 12px; }
    .callcard h3 { font-size: 1.2rem; margin-bottom: 6px; }
    .assetchips { display: flex; flex-wrap: wrap; gap: 8px; }
    .achip { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: 15px; }
    .achip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .achip svg { width: 15px; height: 15px; }
    .q-label { margin: 18px 0 8px; font-weight: 600; }
    .seg.mini { margin: 0; }
    .seg.mini button { padding: 7px 14px; font-size: 14.5px; }
    .out { margin-top: 16px; padding: 18px 20px; }
    .out h4 { margin: 16px 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
    .out h4:first-child { margin-top: 0; }
    .out ul { margin: 0; padding-left: 20px; }
    .out li { margin: 4px 0; }
    .qgroup h3 { margin: 22px 0 6px; font-size: 1.15rem; }

    /* ── looking ahead ── */
    .endings { overflow-x: auto; margin-top: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
    .endings table { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 15.5px; }
    .endings th, .endings td { padding: 14px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    .endings thead th { font: 500 1.14rem/1.2 var(--serif); }
    .endings thead th small { display: block; margin-top: 4px; font: 400 13px/1.3 var(--sans); color: var(--muted); }
    .endings tbody th { width: 140px; color: var(--muted); font-weight: 600; font-size: 14px; }
    .endings th[scope="row"], .endings thead th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); }
    .endings tr:last-child th, .endings tr:last-child td { border-bottom: 0; }
    .endings .first { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }
    .note { color: var(--muted); font-size: 14.5px; }
    .folder { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: f; }
    .folder li { position: relative; padding: 14px 16px 14px 58px; border-top: 1px solid var(--line); counter-increment: f; }
    .folder li:first-child { border-top: 0; }
    .folder li::before { content: counter(f); position: absolute; left: 16px; top: 13px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 14px/28px var(--sans); text-align: center; }
    .help { margin-top: 34px; padding: 26px; }
    .sources { margin-top: 26px; }
    .sources ul { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14.5px; }
    .foot { margin: 22px 0 60px; color: var(--muted); font-size: 14px; }

    /* ── sheets ── */
    dialog.sheet { width: min(640px, 100vw); max-width: 100vw; max-height: 88vh; padding: 0; border: 0; border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); overflow: hidden; }
    dialog.sheet::backdrop { background: rgba(20,22,20,.42); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    dialog.sheet[open] { display: flex; flex-direction: column; animation: pop .28s cubic-bezier(.2,.8,.2,1); }
    .sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
    .sheet-h h3 { font-size: 1.35rem; }
    .xbtn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--bg); cursor: pointer; color: var(--muted); }
    .sheet-b { padding: 18px 20px 22px; overflow-y: auto; }
    .sheet dl { margin: 0; }
    .sheet dt { margin-top: 14px; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    html:lang(gu) .sheet dt, html:lang(hi) .sheet dt { letter-spacing: 0; text-transform: none; font-size: 14px; }
    .sheet dt:first-child { margin-top: 0; }
    .sheet dd { margin: 4px 0 0; }
    .sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .lettertext { white-space: pre-wrap; margin-top: 14px; padding: 18px 20px; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); font: 15.5px/1.6 var(--serif); }
    .ph { background: var(--hint); border-radius: 4px; padding: 0 3px; }
    @media (max-width: 760px) {
      dialog.sheet { margin: auto 0 0; width: 100vw; border-radius: 22px 22px 0 0; max-height: 90vh; }
      dialog.sheet[open] { animation: up .32s cubic-bezier(.2,.8,.2,1); }
      .sheet-b { padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
      .sheet-h::before { content: ''; position: absolute; left: 50%; top: 7px; width: 40px; height: 4px; margin-left: -20px; border-radius: 9px; background: var(--line); }
      .sheet-h { position: relative; padding-top: 22px; touch-action: none; cursor: grab; }
    }

    .paused { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 60px 20px; }
    .paused p { max-width: 30em; margin: 16px auto 28px; font: 1.22rem/1.6 var(--serif); color: var(--muted); }
    .toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); max-width: min(460px, calc(100vw - 40px)); text-align: center; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 60; }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }
    .view { animation: rise .4s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
    @media (max-width: 760px) {
      body { font-size: 16.5px; }

      .endings tbody th { width: 96px; }
    }
    .vt .view { animation: none; }

    @media (prefers-reduced-motion: reduce) { .hero img, .view, .item.open .item-b, dialog.sheet[open] { animation: none; } .hero img { transform: none; } .hero img, .partrow img { transition: none; } }

<script>
/* After Someone Dies: a journey (five parts) and a toolkit (letters, calls, papers, questions).
   Content for each language is inlined below by build.py (content-<lang>.json). */
const DATA = {"en":{"lang":"en","langName":"English","ui":{"draft":"Draft for review · neutral template, not the final design · private page","translationNote":"","kicker":"A family guide to the first 100 days","title":"After Someone Dies","lede":"What to do after someone in your family dies, one step at a time, in the order it needs doing.","care":["If someone you love has just died, we are so sorry. Please be gentle with yourself.","Very little here is urgent. We will show you the few things that are, and the rest can wait until you feel ready. You do not have to do this alone, and you do not have to do it all at once."],"how":"Five short parts, from the first week to the hundredth day. Each begins with what it is about. Tick things off as you go, share a step with someone who can help, and stop whenever you need to. We will keep your place.","begin":"Begin with the first week","welcomeBack":"Welcome back. Take all the time you need.","welcomeWhere":"You stopped at: {stage}.","carryOn":"Carry on from there","startOver":"Start from the beginning","partOf":"Part {n} of 5","next":"When you're ready, the next part","nextLast":"When you're ready, one last thing","back":"Back","notToday":"Not today","pausedTitle":"That is enough for today.","pausedBody":"We have kept your place on this device. Come back whenever you are ready; nothing here will expire, and the next step will be waiting.","pausedReturn":"Return to the guide","stepsTitle":"What to do","questions":"Questions families ask","done":"Done","share":"Share","shareText":"Could you help with this? {step}. The details are here: {url}","copy":"Copy","copied":"Copied","print":"Print everything","lettersTitle":"Letters you can copy","lettersBrief":"Writing these is often the hardest part, so we have started them for you. Fill in the names once and every letter updates. What you type stays on this screen; it is not saved or sent anywhere.","fields":{"name":"Their full name","date":"The date they died","you":"Your name","rel":"You are their (wife, son, daughter...)","inst":"Bank, insurer or branch","ref":"Account, policy or PPO number","phone":"Your phone number"},"phoneTitle":"What to say on the phone","phoneBrief":"When it is hard to find the words, these few lines are enough. Keep a pen nearby: note the date, the name of the person you spoke to, and any reference number.","papersTitle":"Your papers list","papersBrief":"Tick what they had and we will put together one list of every paper to gather. Print it, copy it, or send it to whoever is helping.","papersHad":"What did they have?","papersNominee":"Did they name nominees?","papersWill":"Did they leave a will?","yes":"Yes","no":"No","notSure":"Not sure","papersOut":"Papers to gather","papersEmpty":"Tick what they had, and the list will appear here.","papersForAll":"For every claim","papersHeirs":"Because there may be no nominee","papersWillDocs":"Because there is a will","papersShareText":"The papers we need to gather: {url}","path":["This week","Finding","Who inherits","Claims","Day 100","Ahead"],"footer":"This guide describes general practice in India as of November 2026. Rules differ between institutions and states, and they change. It is not legal or tax advice; for large estates or disagreements, please speak to a lawyer.","sourcesTitle":"Rules this guide follows","navJourney":"Journey","navToolkit":"Toolkit","journeyTitle":"The journey","journeyBrief":"Five short parts, in the order things need doing.","progress":"{d} of {n} done","toolkitTitle":"Your toolkit","toolkitBrief":"Everything you might need to write, say or gather, in one place.","tabLetters":"Letters","tabCalls":"Calls","tabPapers":"Papers","tabQuestions":"Questions","writeLetter":"Write the letter","whatToSay":"What to say","pickHad":"Choose what they had","basedOn":"Based on what they had","addMore":"Something else","chooseFirst":"Tell us what they had, and only those will appear here.","toDo":"To do","claimed":"Claimed","markClaimed":"Mark as claimed","close":"Close","details":"Details","photos":"Photographs from Unsplash.","language":"Language","lookAhead":"Looking ahead","partDone":"That is everything in this part. Rest, or carry on when you are ready."},"stages":[{"id":"week","when":"Days 1 to 7","title":"The first week","brief":"This week belongs to your family. Grieve, gather, and lean on each other. Only a handful of things cannot wait, and none of them is difficult.","steps":[{"t":"Register the death, and ask for ten copies","d":"If they died in hospital, the hospital usually registers the death for you. If not, a family member reports it to the local registrar (in cities, the municipal corporation) within 21 days. Ask for ten or more certified copies of the death certificate; almost every office will want to keep one.","tool":""},{"t":"Set their cards, UPI and cheque book aside","d":"It is natural to want to pay the hospital from their account, but please don't. From the day they died, that money belongs to their estate, and using it now can make claims harder later. Pay from your own account and keep the receipts.","tool":""},{"t":"Keep their phone number working","d":"Bank messages, OTPs and insurance alerts will keep arriving there. They are often how a family finds an account nobody knew about.","tool":""},{"t":"Start one folder","d":"A simple file or box for every paper that turns up: passbooks, policies, statements, pension papers, property documents, and the copies of the death certificate.","tool":""},{"t":"Let one person lead","d":"Choose one person to hold the folder and the list. Everyone else can help, sign when needed, and take a task off their shoulders.","tool":""}],"qs":[{"q":"How many copies of the death certificate do we need?","a":"Ten to fifteen is a comfortable number. Banks, insurers, fund houses, the pension office and the land records office will each usually keep one. Some accept a copy you attest yourself, but originals make everything easier."},{"q":"Can we keep using their account for household costs?","a":"Please don't, even though it feels practical. Once the bank knows, it freezes the account, and it should know. If the family needs money in the meantime, the heirs can ask the bank to release it through its claim process."},{"q":"Do we have to tell the banks this week?","a":"It can wait a little, but do it within the first few weeks. Telling a bank freezes the account, which keeps the money safe until the rightful claim, and stops EMIs and standing instructions running on. There is a letter you can copy in the next part."}],"extras":[]},{"id":"finding","when":"Weeks 2 to 4","title":"Finding what they had","brief":"Almost every family discovers something it did not know about: an old deposit, a forgotten policy, a fund started quietly for a child. This part is about finding it all, gently and without rushing.","steps":[{"t":"Look through their papers and their phone","d":"Passbooks, cheque books, policy bonds, emails from banks and fund houses, and the SMS alerts on their phone.","tool":""},{"t":"Read their bank statements","d":"Regular payments tell the story the papers leave out: insurance premiums, SIPs, recurring deposits, loan EMIs, and the small yearly debits for the government's bank-linked insurance schemes.","tool":""},{"t":"Check their income tax records","d":"Their Annual Information Statement on the income tax portal lists interest, dividends and fund transactions from every institution. Once a family member registers as their legal heir on the portal, it can be opened.","tool":""},{"t":"Ask for one statement of all their investments","d":"A Consolidated Account Statement from CAMS, KFintech or the depositories NSDL and CDSL lists their mutual funds and shares together.","tool":""},{"t":"Search for forgotten money","d":"The government's Unclaimed Assets Portal brings the official searches together: the RBI's UDGAM for old bank deposits, insurers' unclaimed amounts, SEBI's MITRA for old mutual fund folios, and the IEPF for old shares and dividends. These only search; the claim itself goes to the bank, insurer or fund.","tool":""},{"t":"Look at their work and pension papers","d":"For a government pensioner, the Pension Payment Order (PPO) names who receives the family pension. For someone in a private job, the provident fund account (UAN) is the place to start. Post office savings, PPF and senior citizen deposits are held at the post office.","tool":""},{"t":"Note what they had","d":"As things turn up, tick them here: bank accounts, policies, funds, a pension, the home. The claims part and your papers list will then show only what applies to you.","tool":"assets"},{"t":"Tell each bank in writing","d":"A short letter with a copy of the death certificate is enough. It keeps the money safe until it is claimed. The letter is below, ready to copy.","tool":"letter:bank"}],"qs":[{"q":"We don't know which banks they used. How do we find out?","a":"Start with their statements, their phone and their tax records, which show interest from every bank. Then search UDGAM through the Unclaimed Assets Portal. Branches near their old home and workplace are worth a visit with a death certificate."},{"q":"What exactly is a nominee?","a":"The person they named to receive an account or policy. For bank accounts, funds and shares, the nominee collects the money but holds it for all the legal heirs; the Supreme Court said so in 2023, and the RBI's and SEBI's rules now say it plainly. Life insurance is different: when the nominee is a husband or wife, a child or a parent, the money is theirs outright."},{"q":"There is no nominee. Are we stuck?","a":"Not at all. The legal heirs claim together. For a bank account up to ₹15 lakh (₹5 lakh at a cooperative bank), the RBI's rules set out a simpler route: the claim form, the death certificate, ID, an indemnity, no-objection letters from the other heirs, and either an heirship certificate or a declaration from an independent person. It is more paperwork, but the money is safe, and it will come."}],"extras":[]},{"id":"heirs","when":"Month 2","title":"Who inherits","brief":"This part can feel the most formal, and sometimes the most tender, because it asks who the family is in the eyes of the law. Take it slowly, and talk it through together.","intro":["When someone dies without a will, the law decides who inherits. For a Hindu man, the first heirs are his widow, his children and his mother, in equal shares. For a Hindu woman, they are her husband and her children. Families of other faiths follow their own personal laws, with different shares.","A surviving mother is an heir too, and her signature will be needed. Many families only learn this at the bank counter."],"steps":[{"t":"List every heir","d":"Write down each one, with their contact details. Most claims will need every heir's signature or consent.","tool":""},{"t":"Get an heirship certificate","d":"In Gujarat, families usually begin with a pedhinamu, a family tree certified by the Talati with affidavits, and use it to get an heirship (varsai) certificate from the Mamlatdar. Banks, fund houses and offices accept it for most claims.","tool":""},{"t":"A succession certificate, only if asked","d":"A civil court issues it, usually when an institution insists on one for larger holdings. It takes some months, and a court fee that rises with the value.","tool":""},{"t":"Agree, together, who receives what","d":"Many families want everything to go to the surviving husband or wife. The other heirs can make that happen: consent letters for accounts and investments, and a registered release deed for property.","tool":""}],"qs":[{"q":"Doesn't everything go to the husband or wife?","a":"Not without a will. They are one heir among several. It can still be arranged, with each of the other heirs' consent."},{"q":"Heirship certificate or succession certificate: which do we need?","a":"Ask each institution, because the limits differ. Banks settle up to ₹15 lakh without a court certificate. Fund houses settle up to ₹10 lakh per fund house, and demat accounts up to ₹30 lakh, on an indemnity and an affidavit with every heir's no-objection. Above those amounts, an heirship or succession certificate is needed."},{"q":"Can the children give their share to their mother?","a":"Yes, and many do. For accounts and investments, they sign consent letters. For property, they sign a release deed, which is registered and carries stamp duty, usually lower when it stays within the family."},{"q":"What if the family does not agree?","a":"Then a court decides, and that can take years, while most institutions hold everything back. If voices are rising, a calm third person, or a lawyer, sitting with the family early can save a great deal of pain."}],"extras":[]},{"id":"claims","when":"Months 2 and 3","title":"Claiming, one by one","brief":"Now the paperwork turns into progress. Take one account or policy at a time, tick it off, and let each one be a small thing finished. Some take two weeks and some take a few months; both are normal.","cards":[{"h":"Bank accounts and fixed deposits","rows":[["What to do","Give the bank a claim form and the death certificate. Joint accounts held \"either or survivor\" pass straight to the survivor."],["With a nominee","The nominee claims with their ID. The bank pays the nominee, who holds it for the heirs."],["Without a nominee","Up to ₹15 lakh: an indemnity, the other heirs' no-objection, and an heirship certificate or an independent person's declaration. Above it, a succession certificate may be asked for."],["How long","Under the RBI's 2025 rules, within 15 days of complete papers. If the bank is late, it pays compensation."]],"for":["bank","fd"],"tools":["letter:bank","phone:bank"]},{"h":"Bank locker","rows":[["What to do","The nominee, or the heirs together, apply to the bank. Within 15 days the bank fixes a date to open it, and lists the contents in front of them and two independent witnesses."],["Worth knowing","Nothing is handed over until the list is signed. Bring the key and the death certificate."]],"for":["locker"],"tools":[]},{"h":"Life insurance","rows":[["What to do","Tell the insurer, then send the claim form, the death certificate, the policy (or an indemnity if it is lost), the nominee's ID and bank details."],["How long","Within 15 days of the papers when no investigation is needed; within 45 days of the claim when it is."],["Worth knowing","A policy more than three years old cannot be disputed on grounds of what was declared when it was taken out."],["Also check","Group cover from their employer, loan-linked cover, insurance that came with their debit card, and the government schemes debited yearly from their account."]],"for":["insurance"],"tools":["letter:insurance","letter:late","phone:insurer"]},{"h":"Mutual funds","rows":[["What to do","Ask the fund house or its registrar (CAMS or KFintech) to transmit the units to the claimant, with the death certificate, ID and bank proof."],["Worth knowing","The units move as they are; nothing has to be sold, and there is no tax on inheriting them."],["Without a nominee","Up to ₹10 lakh per fund house: a notarised indemnity and an affidavit with every heir's no-objection. Above that, an heirship or succession certificate. Fund houses have 21 days."]],"for":["mf"],"tools":[]},{"h":"Shares and demat","rows":[["What to do","The claimant opens a demat account, then gives the broker or depository participant a transmission form with the death certificate."],["Old paper shares","Go to the company's registrar. Dividends or shares unclaimed for seven years sit with the IEPF and can be claimed back."],["Without a nominee","Up to ₹30 lakh per demat account, the same simpler papers as funds; above that, an heirship or succession certificate."]],"for":["shares"],"tools":[]},{"h":"Their pension","rows":[["What to do","Tell the bank that pays the pension. Any pension credited after the death has to be returned."],["For the husband or wife","If the Pension Payment Order names them, as it usually does, a letter to the same bank with the death certificate, a copy of the PPO and proof of age is enough. No separate form."],["Worth knowing","The CGHS card moves to the family pensioner. If they died while still in service, the family applies through their office instead. State government pensions, and anyone who joined central service from 2004 under NPS, follow different rules."]],"for":["pension"],"tools":["letter:pension","phone:pension"]},{"h":"Provident fund and gratuity","rows":[["Private job","Through EPFO: the provident fund, the pension for the widow or widower and children, and the linked insurance of ₹2.5 lakh to ₹7 lakh. One combined claim form covers all three."],["Government job","If they died in service, their office settles the provident fund, group insurance and death gratuity."]],"for":["pf"],"tools":[]},{"h":"The home","rows":[["What to do","Change the name in the land records (in Gujarat, through the Talati or an e-Dhara centre, with a 30-day window for objections) or at the City Survey Office for a property card; with the society for a flat; and for property tax, electricity and gas."],["Worth knowing","Without a will, the home belongs to all the heirs together until some of them release their share by a registered deed."]],"for":["home","society"],"tools":[]},{"h":"Post office, PPF and senior citizen deposits","rows":[["What to do","Claim at the post office where the account is held, with the death certificate and the claim form."],["Without a nominee","Up to ₹5 lakh on simpler papers; above that, a succession certificate or similar."]],"for":["post"],"tools":[]},{"h":"Loans, cards and the car","rows":[["Loans and cards","Debts are paid from what they left, not from the family's own pockets. Ask each lender whether the loan was insured before paying any EMI. A co-borrower, guarantor or add-on card holder stays liable."],["The car","Tell the RTO within 30 days, and transfer it to the heir who keeps it within three months (Form 31, online through Parivahan)."]],"for":["loans","vehicle"],"tools":[]}],"steps":[],"qs":[{"q":"We found an insurance policy years later. Can we still claim?","a":"Yes. There is no deadline for making a death claim, and the regulator's rules say a claim cannot be rejected only because it was made late. Explain the delay in a short letter with the claim; there is one in your toolkit. Money unclaimed for ten years moves to the Senior Citizens' Welfare Fund, and can still be claimed for another twenty-five. If an insurer is slow or refuses, complain on Bima Bharosa, and then to the Insurance Ombudsman."},{"q":"Will the pension stop?","a":"Their pension stops, and a family pension takes its place for the surviving husband or wife, for life. For a retired central government employee it is 30% of the last pay, paid at a higher 50% for the first seven years or until the pensioner would have turned 67, whichever comes first. After that, a son can receive it until 25, or an unmarried daughter who depends on it. A parent does not receive it while the husband or wife is eligible."},{"q":"Do we have to pay tax on what we inherit?","a":"No. India has no inheritance tax. Interest, rent or gains earned after the inheritance are taxed in the heir's hands as usual, and when inherited funds or shares are later sold, the original cost and holding period count."},{"q":"Do we have to pay off their credit card?","a":"It is paid from what they left, before the heirs take their shares. The family is not personally liable beyond what it inherits, unless someone co-signed, guaranteed the loan or held an add-on card."}],"extras":[]},{"id":"day100","when":"Day 100 and after","title":"Closing the file","brief":"By now the hardest weeks are behind you. What is left is quieter: a tax return, a few accounts to close, and a folder to keep safe.","steps":[{"t":"File their last income tax return","d":"One heir registers as their legal heir on the income tax portal and files the return for their income up to the date they died, by the usual due date (31 July for most families).","tool":""},{"t":"Close what is no longer needed","d":"Old accounts, subscriptions, their email and social media (most can be closed or memorialised with a death certificate).","tool":""},{"t":"Keep the folder","d":"Claims, deeds and tax papers can be asked for years later. Keep them for at least eight years.","tool":""}],"qs":[{"q":"Do we really have to file their tax return?","a":"Yes, if their income for the year needed a return. The legal heir files it in their name, as their representative, and any refund due comes to the estate."},{"q":"Is it too late to do any of this?","a":"Almost never. Unclaimed bank deposits can be claimed at any time, insurance money for twenty-five years after it moves to the welfare fund, and old shares and dividends from the IEPF. It only takes more letters."}],"closing":"Be kind to yourselves. Grief keeps its own calendar, and it does not end on the hundredth day.","extras":[]}],"ahead":{"when":"When you feel ready","title":"Looking ahead","brief":"When you feel ready, and only then: a few minutes on how these same months can go for the next generation.","endingsTitle":"Three endings","endingsBrief":"The same family, the same loss, three ways it can unfold.","cols":["No will","A will","A family trust"],"colNotes":["What most families face","If one had been written","If one had been set up"],"rows":[["Who decides","The law: equal shares among the heirs, including a surviving parent.","The person who wrote it: for example, everything to the husband or wife, with care for a parent.","The person who set it up, years earlier: the trust deed says who benefits, and when."],["Who signs","Every heir, on every claim.","The executor named in the will.","The trustee, who simply carries on."],["Papers and courts","An heirship certificate, indemnities, and for larger holdings a succession certificate.","The will itself. Since 2025, probate is not compulsory anywhere in India.","None for what the trust already owns."],["How long","Three to nine months is common; longer with a court certificate or a disagreement.","One to four months.","Days to weeks for what the trust holds."],["The home","Owned jointly by the heirs until some release their share by registered deed.","Passes to whoever the will names.","Already in the trust; nothing changes hands."],["How it feels","Even when everyone agrees, it is months of queues and signatures.","Clearer, though a will can still be challenged.","Private and quiet, at the cost of setting it up in good time."]],"endingsNote":"Illustrative, not a promise. There is no official data on how long estates take; these ranges come from practitioners, and real timelines depend on the family, the amounts and the institutions. A trust suits some families and not others, and some things, such as pensions and provident fund, cannot be placed in one.","folderTitle":"Your own folder","folderBrief":"The kindest thing many families do after a loss is make sure the next one is easier. It takes an afternoon.","folder":["Nominees on every account and policy. Banks now allow up to four on a deposit.","A will, even a simple one, registered if you can.","One list of where everything is: accounts, policies, investments, property, and how to reach the people who know.","Tell one person where the folder lives."],"helpTitle":"If you would like someone beside you","help":"Some families want help with the paperwork now; others want to make sure their own family never needs this page. Either way, we would be glad to talk, gently and without obligation.","closing":"None of this is about what anyone did wrong. Most people mean to sort their papers out, and there always seems to be time."},"letters":[{"id":"bank","title":"Telling a bank about the death","body":"To the Branch Manager,\n{inst}\n\nSubject: Intimation of the death of {name}, account number {ref}\n\nDear Sir or Madam,\n\nI am writing to let you know that {name}, who held the account above with your branch, passed away on {date}. A copy of the death certificate is enclosed.\n\nI would be grateful if you could note this in your records, stop all transactions, standing instructions and auto-debits on the account, and let me know the procedure and documents needed to claim the balance, any fixed deposits, and the contents of any locker.\n\nI am {name}'s {rel}, and I can be reached on {phone}.\n\nThank you for your help at this difficult time.\n\nYours sincerely,\n{you}\nDate: {today}\n\nEnclosed: copy of the death certificate"},{"id":"insurance","title":"Making a life insurance claim","body":"To the Claims Department,\n{inst}\n\nSubject: Death claim under policy number {ref}, life assured {name}\n\nDear Sir or Madam,\n\nI am writing to make a claim under the policy above. The life assured, {name}, passed away on {date}.\n\nI am {name}'s {rel}. I enclose the claim form, the death certificate, the policy document, my ID and address proof, and a cancelled cheque for payment.\n\nPlease let me know if anything else is needed. I can be reached on {phone}.\n\nThank you for your help.\n\nYours sincerely,\n{you}\nDate: {today}"},{"id":"late","title":"Explaining a late insurance claim","body":"To the Claims Department,\n{inst}\n\nSubject: Death claim under policy number {ref}, life assured {name}, and the reason for the delay\n\nDear Sir or Madam,\n\n{name} passed away on {date}. I am sorry that this claim reaches you later than usual: the policy came to light only recently, while our family was going through their papers.\n\nI understand from the IRDAI's guidelines that a genuine claim should not be rejected only because it was made late. I would be grateful if you could process the enclosed claim.\n\nI am {name}'s {rel}, and I can be reached on {phone}.\n\nYours sincerely,\n{you}\nDate: {today}\n\nEnclosed: claim form, death certificate, policy document, ID and address proof, cancelled cheque"},{"id":"pension","title":"Starting the family pension","body":"To the Manager,\n{inst}\n\nSubject: Request to start family pension under PPO number {ref}\n\nDear Sir or Madam,\n\n{name}, a pensioner drawing pension from your branch under the PPO above, passed away on {date}. I am {name}'s {rel}, and I am named in the PPO as the family pensioner.\n\nI request you to stop the pension and start the family pension in my name.\n\nI enclose the death certificate, a copy of the PPO, proof of my age, and my bank account details. I can be reached on {phone}.\n\nYours sincerely,\n{you}\nDate: {today}"}],"phone":[{"id":"bank","title":"Calling a bank","lines":["Hello. I am calling because {name}, who has an account with you, passed away recently.","Could you please note the death and freeze the account, so nothing more is debited?","Is there a nominee on the account?","What is the claim process, and which documents do you need from the family?","Could you send that to me in writing, or tell me which branch to visit?"]},{"id":"insurer","title":"Calling an insurer","lines":["Hello. I would like to make a death claim. The policyholder, {name}, passed away on {date}.","The policy number is {ref}.","Which documents do you need, and can I submit them online or at a branch?","Could you give me a claim reference number?"]},{"id":"pension","title":"Calling the pension bank","lines":["Hello. {name} drew a pension from your branch, and passed away on {date}.","Please stop the pension, and tell me how to start the family pension in my name.","I am named in the PPO. Which documents should I bring?"]}],"papers":{"assets":[{"id":"bank","label":"Bank accounts","items":["The bank's claim form","Passbook or latest statement","Cheque book and debit cards, to return"]},{"id":"fd","label":"Fixed deposits","items":["Fixed deposit receipts or advices"]},{"id":"locker","label":"A bank locker","items":["The locker key","The locker agreement, if you have it"]},{"id":"insurance","label":"Life insurance","items":["The insurer's claim અવસાનની નોંધણી કરાવો, અને દસ નકલો માંગો","d":"જો તેમનું અવસાન હોસ્પિટલમાં થયું હોય, તો સામાન્ય રીતે હોસ્પિટલ જ તમારા વતી નોંધણી કરાવી દે છે. જો એમ ન હોય, તો પરિવારના કોઈ સભ્ય 21 દિવસની અંદર સ્થાનિક રજિસ્ટ્રારને (શહેરોમાં, મહાનગરપાલિકાને) જાણ કરે છે. મરણ પ્રમાણપત્ર (death certificate) ની દસ કે તેથી વધુ પ્રમાણિત નકલો માંગજો; લગભગ દરેક કચેરી એક નકલ પોતાની પાસે રાખશે.","tool":""},{"t":"તેમનાં કાર્ડ, UPI અને ચેકબુક બાજુ પર મૂકી દો","d":"હોસ્પિટલનું બિલ તેમના ખાતામાંથી ચૂકવવાનું મન થવું સ્વાભાવિક છે, પણ કૃપા કરીને એમ ન કરશો. અવસાનના દિવસથી એ પૈસા તેમની વારસાગત મિલકત (estate) ગણાય છે, અને અત્યારે તેનો ઉપયોગ કરવાથી પછી દાવો (claim) કરવામાં મુશ્કેલી પડી શકે છે. તમારા પોતાના ખાતામાંથી ચૂકવણી કરો અને તેની રસીદો સાચવી રાખો.","tool":""},{"t":"તેમનો ફોન નંબર ચાલુ રાખો","d":"બેંકના મેસેજ, OTP અને વીમાની સૂચનાઓ ત્યાં આવતી રહેશે. ઘણી વાર આના પરથી જ પરિવારને એવા ખાતાની જાણ થાય છે, જેના વિશે કોઈને ખબર ન હતી.","tool":""},{"t":"એક ફોલ્ડર શરૂ કરો","d":"જે પણ કાગળ મળે તે બધા માટે એક સાદી ફાઇલ કે ડબ્બો: પાસબુક, પોલિસીઓ, સ્ટેટમેન્ટ, પેન્શનના કાગળો, મિલકતના દસ્તાવેજો, અને મરણ પ્રમાણપત્રની નકલો.","tool":""},{"t":"એક વ્યક્તિને આગેવાની લેવા દો","d":"ફોલ્ડર અને યાદી સંભાળવા માટે એક વ્યક્તિને પસંદ કરો. બાકીના બધા મદદ કરી શકે, જરૂર પડે ત્યારે સહી કરી શકે, અને કોઈ કામ પોતાના માથે લઈને તેમનો ભાર હળવો કરી શકે.","tool":""}],"qs":[{"q":"મરણ પ્રમાણપત્રની કેટલી નકલો જોઈશે?","a":"દસથી પંદર નકલો રાખવી અનુકૂળ રહે છે. બેંકો, વીમા કંપનીઓ, ફંડ હાઉસ, પેન્શન કચેરી અને જમીન રેકોર્ડની કચેરી, દરેક સામાન્ય રીતે એક નકલ રાખે છે. કેટલીક જગ્યાએ તમે જાતે પ્રમાણિત (self-attest) કરેલી નકલ ચાલે છે, પણ અસલ પ્રમાણપત્રો હોય તો બધું સરળ બને છે."},{"q":"ઘરખર્ચ માટે શું અમે તેમનું ખાતું વાપરવાનું ચાલુ રાખી શકીએ?","a":"ભલે તે વ્યવહારુ લાગે, કૃપા કરીને એમ ન કરશો. બેંકને જાણ થતાં જ તે ખાતું ફ્રીઝ (સ્થગિત) કરે છે, અને બેંકને જાણ કરવી જ જોઈએ. આ દરમિયાન પરિવારને પૈસાની જરૂર હોય, તો વારસદારો બેંકની દાવા પ્રક્રિયા દ્વારા પૈસા છૂટા કરવા વિનંતી કરી શકે છે."},{"q":"શું આ અઠવાડિયે જ બેંકોને જાણ કરવી પડે?","a":"થોડી રાહ જોઈ શકાય, પણ પહેલાં થોડાં અઠવાડિયાંમાં જાણ કરી દેજો. બેંકને જાણ કરવાથી ખાતું ફ્રીઝ થાય છે, જેથી યોગ્ય દાવો થાય ત્યાં સુધી પૈસા સુરક્ષિત રહે છે, અને EMI તથા સ્ટેન્ડિંગ ઇન્સ્ટ્રક્શન (નિયમિત આપોઆપ થતી ચુકવણી) ચાલુ રહેતાં અટકે છે. આગળના ભાગમાં કૉપિ કરી શકાય તેવો પત્ર આપેલો છે."}],"extras":[]},{"id":"finding","when":"અઠવાડિયું 2 થી 4","title":"તેમની પાસે શું શું હતું, તે શોધવું","brief":"લગભગ દરેક પરિવારને કંઈક એવું મળે છે જેની તેમને જાણ ન હતી: કોઈ જૂની ડિપોઝિટ, ભુલાઈ ગયેલી પોલિસી, કે કોઈ બાળક માટે ચૂપચાપ શરૂ કરેલું ફંડ. આ ભાગ એ બધું શોધવા વિશે છે, શાંતિથી અને ઉતાવળ વગર.","steps":[{"t":"તેમના કાગળો અને ફોન તપાસો","d":"પાસબુક, ચેકબુક, પોલિસી બોન્ડ, બેંકો અને ફંડ હાઉસના ઇમેઇલ, અને તેમના ફોન પરના SMS સંદેશા.","tool":""},{"t":"તેમનાં બેંક સ્ટેટમેન્ટ વાંચો","d":"નિયમિત ચુકવણીઓ એવી વાત કહે છે જે કાગળોમાં નથી હોતી: વીમાના પ્રીમિયમ, SIP, રિકરિંગ ડિપોઝિટ, લોનના EMI, અને બેંક સાથે જોડાયેલી સરકારી વીમા યોજનાઓ માટે દર વર્ષે કપાતી નાની રકમ.","tool":""},{"t":"તેમના આવકવેરાના રેકોર્ડ તપાસો","d":"આવકવેરા પોર્ટલ પરના તેમના Annual Information Statement (વાર્ષિક માહિતી પત્રક) માં દરેક સંસ્થા તરફથી મળેલું વ્યાજ, ડિવિડન્ડ અને ફંડના વ્યવહારો નોંધાયેલા હોય છે. પરિવારના કોઈ સભ્ય પોર્ટલ પર તેમના કાયદેસર વારસદાર (legal heir) તરીકે નોંધણી કરાવે, પછી તે ખોલી શકાય છે.","tool":""},{"t":"તેમના બધા રોકાણોનું એક જ સ્ટેટમેન્ટ મંગાવો","d":"CAMS, KFintech અથવા ડિપોઝિટરી NSDL અને CDSL તરફથી મળતા Consolidated Account Statement (સંયુક્ત ખાતા પત્રક) માં તેમના મ્યુચ્યુઅલ ફંડ અને શેર એકસાથે દેખાય છે.","tool":""},{"t":"ભુલાઈ ગયેલા પૈસા શોધો","d":"સરકારનું Unclaimed Assets Portal બધી સત્તાવાર શોધને એક જગ્યાએ લાવે છે: જૂની બેંક ડિપોઝિટ માટે RBI નું UDGAM, વીમા કંપનીઓ પાસે પડેલી દાવો ન થયેલી રકમ, જૂના મ્યુચ્યુઅલ ફંડ ફોલિયો માટે SEBI નું MITRA, અને જૂના શેર તથા ડિવિડન્ડ માટે IEPF. આ ફક્ત શોધવા માટે છે; દાવો તો બેંક, વીમા કંપની કે ફંડ પાસે જ કરવાનો હોય છે.","tool":""},{"t":"તેમની નોકરી અને પેન્શનના કાગળો જુઓ","d":"સરકારી પેન્શનરના કિસ્સામાં, Pension Payment Order (PPO) માં લખેલું હોય છે કે કુટુંબ પેન્શન કોને મળશે. ખાનગી નોકરીમાં હોય તેવી વ્યક્તિ માટે, પ્રોવિડન્ટ ફંડ ખાતું (UAN) શરૂઆત કરવાની જગ્યા છે. પોસ્ટ ઓફિસ બચત, PPF અને વરિષ્ઠ નાગરિક ડિપોઝિટ પોસ્ટ ઓફિસમાં જ હોય છે.","tool":""},{"t":"તેમની પાસે શું હતું તે નોંધો","d":"જેમ જેમ વસ્તુઓ મળે, તેમ અહીં ટિક કરતા જાઓ: બેંક ખાતાં, પોલિસી, ફંડ, પેન્શન, ઘર. પછી દાવાના ભાગમાં અને તમારી કાગળોની યાદીમાં ફક્ત તમને લાગુ પડતું જ દેખાશે.","tool":"assets"},{"t":"દરેક બેંકને લેખિતમાં જાણ કરો","d":"મરણ પ્રમાણપત્રની નકલ સાથે એક ટૂંકો પત્ર પૂરતો છે. તેનાથી દાવો થાય ત્યાં સુધી પૈસા સુરક્ષિત રહે છે. પત્ર નીચે આપેલો છે, કૉપિ કરવા માટે તૈયાર.","tool":"letter:bank"}],"qs":[{"q":"તેમનાં ખાતાં કઈ કઈ બેંકોમાં હતાં તે અમને ખબર નથી. કેવી રીતે જાણવું?","a":"તેમનાં સ્ટેટમેન્ટ, ફોન અને આવકવેરાના રેકોર્ડથી શરૂઆત કરો, જેમાં દરેક બેંકમાંથી મળેલું વ્યાજ દેખાય છે. પછી Unclaimed Assets Portal દ્વારા UDGAM પર શોધ કરો. તેમના જૂના ઘર અને કામના સ્થળની નજીકની શાખાઓમાં મરણ પ્રમાણપત્ર સાથે એક વાર જઈ આવવું યોગ્ય છે."},{"q":"નોમિની એટલે બરાબર શું?","a":"કોઈ ખાતા કે પોલિસીની રકમ મેળવવા માટે તેમણે જે વ્યક્તિનું નામ આપ્યું હોય (નામાંકિત વ્યક્તિ), તે. બેંક ખાતાં, ફંડ અને શેરમાં, નોમિની પૈસા મેળવે છે, પણ તે બધા કાયદેસર વારસદારો વતી સાચવે છે; સુપ્રીમ કોર્ટે 2023 માં આમ કહ્યું હતું, અને હવે RBI અને SEBI ના નિયમો પણ સ્પષ્ટ રીતે આ જ કહે છે. જીવન વીમામાં વાત જુદી છે: જ્યારે નોમિની પતિ કે પત્ની, સંતાન, અથવા માતા કે પિતા હોય, ત્યારે એ પૈસા સંપૂર્ણપણે તેમના જ થાય છે."},{"q":"નોમિની નથી. તો શું અમે અટવાઈ ગયા?","a":"જરા પણ નહીં. કાયદેસર વારસદારો સાથે મળીને દાવો કરે છે. ₹15 લાખ સુધીના બેંક ખાતા માટે (સહકારી બેંકમાં ₹5 લાખ સુધી), RBI ના નિયમોમાં એક સરળ માર્ગ આપેલો છે: દાવા ફોર્મ, મરણ પ્રમાણપત્ર, ઓળખપત્ર, ઇન્ડેમ્નિટી બોન્ડ (ક્ષતિપૂર્તિની બાંહેધરી), બાકીના વારસદારોના ના-વાંધા પત્રો, અને વારસાઈ પ્રમાણપત્ર (heirship certificate) અથવા કોઈ સ્વતંત્ર વ્યક્તિનું ઘોષણાપત્ર. કાગળકામ થોડું વધારે છે, પણ પૈસા સુરક્ષિત છે, અને તે મળશે જ."}],"extras":[]},{"id":"heirs","when":"મહિનો 2","title":"વારસો કોને મળે","brief":"આ ભાગ સૌથી ઔપચારિક લાગી શકે, અને ક્યારેક સૌથી નાજુક પણ, કારણ કે તે પૂછે છે કે કાયદાની નજરે પરિવાર કોણ છે. ધીમે ધીમે આગળ વધજો, અને સાથે બેસીને વાત કરજો.","intro":["કોઈ વ્યક્તિ વસિયત વગર અવસાન પામે, ત્યારે વારસો કોને મળે તે કાયદો નક્કી કરે છે. હિંદુ પુરુષના કિસ્સામાં, પ્રથમ વારસદારો તેમનાં પત્ની, તેમનાં સંતાનો અને તેમનાં માતા છે, સરખા ભાગે. હિંદુ સ્ત્રીના કિસ્સામાં, તેમના પતિ અને તેમનાં સંતાનો. અન્ય ધર્મના પરિવારો પોતાના પર્સનલ લૉ (વ્યક્તિગત કાયદા) અનુસરે છે, જેમાં ભાગ જુદા હોય છે.","હયાત માતા પણ વારસદાર છે, અને તેમની સહી જરૂરી બનશે. ઘણા પરિવારોને આ વાતની જાણ બેંકના કાઉન્ટર પર જ થાય છે."],"steps":[{"t":"દરેક વારસદારની યાદી બનાવો","d":"દરેકનું નામ, તેમની સંપર્ક વિગતો સાથે લખી લો. મોટા ભાગના દાવાઓમાં દરેક વારસદારની સહી કે સંમતિ જરૂરી બનશે.","tool":""},{"t":"વારસાઈ પ્રમાણપત્ર મેળવો","d":"ગુજરાતમાં, પરિવારો સામાન્ય રીતે પેઢીનામાથી શરૂઆત કરે છે, એટલે કે સોગંદનામાં સાથે તલાટી દ્વારા પ્રમાણિત કરેલું કુટુંબનું વંશવૃક્ષ, અને તેના આધારે મામલતદાર પાસેથી વારસાઈ પ્રમાણપત્ર (heirship certificate) મેળવે છે. મોટા ભાગના દાવાઓ માટે બેંકો, ફંડ હાઉસ અને કચેરીઓ તે સ્વીકારે છે.","tool":""},{"t":"ઉત્તરાધિકાર પ્રમાણપત્ર, ફક્ત માંગવામાં આવે તો જ","d":"ઉત્તરાધિકાર પ્રમાણપત્ર (succession certificate) સિવિલ કોર્ટ આપે છે, સામાન્ય રીતે ત્યારે જ્યારે મોટી રકમના રોકાણ કે મિલકત માટે કોઈ સંસ્થા તેનો આગ્રહ રાખે. તેમાં થોડા મહિના લાગે છે, અને કોર્ટ ફી ભરવી પડે છે, જે મિલકતના મૂલ્ય સાથે વધે છે.","tool":""},{"t":"સાથે મળીને નક્કી કરો કે કોને શું મળે","d":"ઘણા પરિવારો ઇચ્છે છે કે બધું હયાત પતિ કે પત્નીને મળે. બાકીના વારસદારો આ શક્ય બનાવી શકે છે: ખાતાં અને રોકાણો માટે સંમતિ પત્રો, અને મિલકત માટે નોંધાયેલી (રજિસ્ટર્ડ) રિલીઝ ડીડ (હક્ક જતો કરવાનો દસ્તાવેજ).","tool":""}],"qs":[{"q":"શું બધું પતિ કે પત્નીને નથી મળતું?","a":"વસિયત ન હોય તો નહીં. તેઓ ઘણા વારસદારોમાંથી એક છે. તેમ છતાં, બાકીના દરેક વારસદારની સંમતિથી આવી ગોઠવણ કરી શકાય છે."},{"q":"વારસાઈ પ્રમાણપત્ર કે ઉત્તરાધિકાર પ્રમાણપત્ર: અમારે કયું જોઈએ?","a":"દરેક સંસ્થાને પૂછજો, કારણ કે મર્યાદાઓ જુદી જુદી છે. બેંકો કોર્ટના પ્રમાણપત્ર વગર ₹15 લાખ સુધીના દાવાનો નિકાલ કરે છે. ઇન્ડેમ્નિટી બોન્ડ અને દરેક વારસદારના ના-વાંધા સાથેના સોગંદનામાના આધારે, ફંડ હાઉસ, ફંડ હાઉસ દીઠ ₹10 લાખ સુધીના, અને ડીમેટ ખાતાં ₹30 લાખ સુધીના દાવાનો નિકાલ કરે છે. આ રકમથી વધુ હોય, તો વારસાઈ કે ઉત્તરાધિકાર પ્રમાણપત્ર જરૂરી છે."},{"q":"શું સંતાનો પોતાનો ભાગ માતાને આપી શકે?","a":"હા, અને ઘણા એવું કરે છે. ખાતાં અને રોકાણો માટે, તેઓ સંમતિ પત્રો પર સહી કરે છે. મિલકત માટે, તેઓ રિલીઝ ડીડ પર સહી કરે છે, જેની નોંધણી થાય છે અને તેના પર સ્ટેમ્પ ડ્યુટી લાગે છે, જે મિલકત પરિવારની અંદર જ રહે ત્યારે સામાન્ય રીતે ઓછી હોય છે."},{"q":"જો પરિવારમાં સહમતિ ન થાય તો?","a":"તો કોર્ટ નક્કી કરે છે, અને તેમાં વર્ષો લાગી શકે છે, અને તે દરમિયાન મોટા ભાગની સંસ્થાઓ બધું રોકી રાખે છે. જો અવાજ ઊંચા થવા લાગે, તો શરૂઆતમાં જ કોઈ શાંત ત્રીજી વ્યક્તિ, કે કોઈ વકીલ, પરિવાર સાથે બેસે તો ઘણી પીડામાંથી બચી શકાય છે."}],"extras":[]},{"id":"claims","when":"મહિનો 2 અને 3","title":"એક પછી એક દાવો","brief":"હવે કાગળકામનું ફળ દેખાવા લાગે છે. એક સમયે એક ખાતું કે પોલિસી લો, તેને ટિક કરો, અને દરેકને એક નાનું પૂરું થયેલું કામ ગણો. કેટલાકમાં બે અઠવાડિયાં લાગે છે અને કેટલાકમાં થોડા મહિના; બંને સામાન્ય છે.","cards":[{"h":"બેંક ખાતાં અને ફિક્સ્ડ ડિપોઝિટ","rows":[["શું કરવું","બેંકને દાવા ફોર્મ અને મરણ પ્રમાણપત્ર આપો. \"either or survivor\" (બેમાંથી કોઈ એક અથવા હયાત ખાતાધારક) પ્રકારનાં સંયુક્ત ખાતાં સીધાં હયાત ખાતાધારકને મળે છે."],["નોમિની હોય તો","નોમિની પોતાના ઓળખપત્ર સાથે દાવો કરે છે. બેંક નોમિનીને ચૂકવણી કરે છે, અને નોમિની તે રકમ વારસદારો વતી સાચવે છે."],["નોમિની ન હોય તો","₹15 લાખ સુધી: ઇન્ડેમ્નિટી બોન્ડ, બાકીના વારસદારોનો ના-વાંધો, અને વારસાઈ પ્રમાણપત્ર અથવા કોઈ સ્વતંત્ર વ્યક્તિનું ઘોષણાપત્ર. તેનાથી વધુ રકમ હોય, તો ઉત્તરાધિકાર પ્રમાણપત્ર માંગવામાં આવી શકે."],["કેટલો સમય","RBI ના 2025 ના નિયમો મુજબ, પૂરા કાગળો મળ્યાના 15 દિવસની અંદર. જો બેંક મોડું કરે, તો તેણે વળતર ચૂકવવું પડે છે."]],"for":["bank","fd"],"tools":["letter:bank","phone:bank"]},{"h":"બેંક લોકર","rows":[["શું કરવું","નોમિની, અથવા બધા વારસદારો સાથે મળીને, બેંકને અરજી કરે છે. 15 દિવસની અંદર બેંક લોકર ખોલવાની તારીખ નક્કી કરે છે, અને તેમની તથા બે સ્વતંત્ર સાક્ષીઓની હાજરીમાં અંદરની વસ્તુઓની યાદી બનાવે છે."],["જાણવા જેવું","યાદી પર સહી થાય ત્યાં સુધી કશું સોંપવ પર ઓનલાઇન)."]],"for":["loans","vehicle"],"tools":[]}],"steps":[],"qs":[{"q":"વર્ષો પછી અમને એક વીમા પોલિસી મળી. શું હજુ દાવો કરી શકાય?","a":"હા. અવસાન પછીનો વીમા દાવો (death claim) કરવાની કોઈ અંતિમ તારીખ નથી, અને નિયમનકાર (regulator) ના નિયમો કહે છે કે ફક્ત મોડો થયો હોવાના કારણે દાવો નકારી શકાય નહીં. દાવા સાથે એક ટૂંકા પત્રમાં વિલંબનું કારણ સમજાવો; એવો પત્ર તમારી સાધનપેટીમાં છે. દસ વર્ષ સુધી દાવો ન થયેલી રકમ Senior Citizens' Welfare Fund (વરિષ્ઠ નાગરિક કલ્યાણ ભંડોળ) માં જાય છે, અને તે પછી પણ બીજાં પચીસ વર્ષ સુધી તેનો દાવો કરી શકાય છે. જો વીમા કંપની ઢીલ કરે કે ના પાડે, તો Bima Bharosa પર ફરિયાદ કરો, અને પછી Insurance Ombudsman (વીમા લોકપાલ) ને."},{"q":"શું પેન્શન બંધ થઈ જશે?","a":"તેમનું પેન્શન બંધ થાય છે, અને તેના સ્થાને હયાત પતિ કે પત્નીને આજીવન કુટુંબ પેન્શન મળે છે. કેન્દ્ર સરકારના નિવૃત્ત કર્મચારીના કિસ્સામાં, તે છેલ્લા પગારના 30% હોય છે, પણ પહેલાં સાત વર્ષ સુધી, અથવા પેન્શનરની ઉંમર 67 વર્ષ થઈ હોત ત્યાં સુધી (બેમાંથી જે વહેલું આવે), તે વધારે દરે, એટલે કે 50% લેખે ચૂકવાય છે. ત્યાર બાદ, પુત્રને 25 વર્ષની ઉંમર સુધી, અથવા તેના પર નિર્ભર અપરિણીત પુત્રીને તે મળી શકે છે. પતિ કે પત્ની પાત્ર હોય ત્યાં સુધી માતા કે પિતાને તે મળતું નથી."},{"q":"વારસામાં મળેલી મિલકત પર શું અમારે કર ભરવો પડે?","a":"ના. ભારતમાં વારસા કર (inheritance tax) નથી. વારસો મળ્યા પછી થતી વ્યાજ, ભાડા કે નફાની આવક પર, હંમેશની જેમ વારસદારની આવક તરીકે કર લાગે છે, અને વારસામાં મળેલાં ફંડ કે શેર પછીથી વેચાય ત્યારે, મૂળ ખરીદ કિંમત અને મૂળ ધારણ સમયગાળો (holding period) ગણાય છે."},{"q":"શું અમારે તેમના ક્રેડિટ કાર્ડનું બાકી ચૂકવવું પડે?","a":"તે તેમણે છોડેલી મિલકતમાંથી ચૂકવાય છે, વારસદારો પોતાનો ભાગ લે તે પહેલાં. વારસામાં મળેલી રકમથી વધુ માટે પરિવાર વ્યક્તિગત રીતે જવાબદાર નથી, સિવાય કે કોઈએ સાથે સહી કરી હોય, લોન માટે જામીન આપ્યા હોય, કે એડ-ઓન કાર્ડ ધરાવ્યું હોય."}],"extras":[]},{"id":"day100","when":"દિવસ 100 અને ત્યાર પછી","title":"ફાઇલ પૂરી કરવી","brief":"અત્યાર સુધીમાં સૌથી કઠિન અઠવાડિયાં પાછળ રહી ગયાં છે. જે બાકી છે તે વધુ શાંત કામ છે: એક આવકવેરા રિટર્ન, બંધ કરવાનાં થોડાં ખાતાં, અને સાચવીને રાખવાનું એક ફોલ્ડર.","steps":[{"t":"તેમનું છેલ્લું આવકવેરા રિટર્ન ભરો","d":"એક વારસદાર આવકવેરા પોર્ટલ પર તેમના કાયદેસર વારસદાર તરીકે નોંધણી કરાવે છે, અને અવસાનની તારીખ સુધીની તેમની આવકનું રિટર્ન સામાન્ય નિયત તારીખ સુધીમાં ભરે છે (મોટા ભાગના પરિવારો માટે 31 જુલાઈ).","tool":""},{"t":"જેની હવે જરૂર નથી તે બંધ કરો","d":"જૂનાં ખાતાં, સબ્સ્ક્રિપ્શન, તેમનું ઇમેઇલ અને સોશિયલ મીડિયા (મોટા ભાગનાં મરણ પ્રમાણપત્ર આપીને બંધ કરી શકાય છે, અથવા સ્મૃતિ ખાતા (memorialised) તરીકે રાખી શકાય છે).","tool":""},{"t":"ફોલ્ડર સાચવી રાખો","d":"દાવા, દસ્તાવેજો અને કરના કાગળો વર્ષો પછી પણ માંગવામાં આવી શકે છે. તેને ઓછામાં ઓછાં આઠ વર્ષ સાચવી રાખો.","tool":""}],"qs":[{"q":"શું ખરેખર તેમનું ટેક્સ રિટર્ન ભરવું પડે?","a":"હા, જો તે વર્ષની તેમની આવક માટે રિટર્ન ભરવું જરૂરી હોય. કાયદેસર વારસદાર તેમના પ્રતિનિધિ તરીકે, તેમના નામે રિટર્ન ભરે છે, અને જો કોઈ રિફંડ મળવાપાત્ર હોય તો તે તેમની વારસાગત મિલકત (estate) માં જમા થાય છે."},{"q":"શું હવે આમાંનું કંઈ કરવામાં બહુ મોડું થઈ ગયું છે?","a":"લગભગ ક્યારેય નહીં. દાવો ન થયેલી બેંક ડિપોઝિટનો ગમે ત્યારે દાવો કરી શકાય છે, વીમાની રકમનો કલ્યાણ ભંડોળમાં ગયા પછી પચીસ વર્ષ સુધી, અને જૂના શેર તથા ડિવિડન્ડનો IEPF પાસેથી. બસ થોડા વધુ પત્રો લખવા પડે છે."}],"closing":"પોતાની સાથે પ્રેમથી વર્તજો. શોકનો પોતાનો સમય હોય છે, અને તે સોમા દિવસે પૂરો નથી થતો.","extras":[]}],"ahead":{"when":"જ્યારે તમે તૈયાર અનુભવો","title":"આગળનો વિચાર","brief":"જ્યારે તમે તૈયાર અનુભવો, અને ત્યારે જ: થોડી મિનિટો, આવનારી પેઢી માટે આ જ મહિનાઓ કેવી રીતે પસાર થઈ શકે તેના વિશે.","endingsTitle":"ત્રણ રસ્તા","endingsBrief":"એ જ પરિવાર, એ જ ખોટ, અને આગળ શું થાય તેના ત્રણ રસ્તા.","cols":["વસિયત વગર","વસિયત સાથે","ફેમિલી ટ્રસ્ટ સાથે"],"colNotes":["મોટા ભાગના પરિવારો જે અનુભવે છે","જો વસિયત લખાઈ હોત","જો ટ્રસ્ટ બનાવાયું હોત"],"rows":[["કોણ નક્કી કરે","કાયદો: વારસદારો વચ્ચે સરખા ભાગ, જેમાં હયાત માતા કે પિતાનો પણ સમાવેશ થાય છે.","વસિયત લખનાર વ્યક્તિ: ઉદાહરણ તરીકે, બધું પતિ કે પત્નીને, અને માતા કે પિતાની સંભાળની જોગવાઈ સાથે.","વર્ષો પહેલાં ટ્રસ્ટ બનાવનાર વ્યક્તિ: ટ્રસ્ટ ડીડમાં લખેલું હોય છે કે લાભ કોને મળશે, અને ક્યારે."],["સહી કોણ કરે","દરેક વારસદાર, દરેક દાવા પર.","વસિયતમાં નીમેલા વહીવટકર્તા (executor).","ટ્રસ્ટી, જે બસ કામ ચાલુ રાખે છે."],["કાગળો અને કોર્ટ","વારસાઈ પ્રમાણપત્ર, ઇન્ડેમ્નિટી બોન્ડ, અને મોટી રકમ માટે ઉત્તરાધિકાર પ્રમાણપત્ર.","વસિયત પોતે. 2025 થી, ભારતમાં ક્યાંય પ્રોબેટ (probate) ફરજિયાત નથી.","ટ્રસ્ટની માલિકીની વસ્તુઓ માટે કંઈ જ નહીં."],["કેટલો સમય","ત્રણથી નવ મહિના સામાન્ય છે; કોર્ટના પ્રમાણપત્ર કે મતભેદ હોય તો વધુ.","એકથી ચાર મહિના.","ટ્રસ્ટ પાસે જે છે તેના માટે થોડા દિવસથી થોડાં અઠવાડિયાં."],["ઘર","કેટલાક વારસદારો નોંધાયેલા દસ્તાવેજથી પોતાનો ભાગ જતો ન કરે ત્યાં સુધી, બધા વારસદારોની સંયુક્ત માલિકીનું.","વસિયતમાં જેમનું નામ હોય તેમને મળે છે.","પહેલેથી જ ટ્રસ્ટમાં છે; માલિકી બદલાતી નથી."],["કેવું લાગે","બધા સહમત હોય ત્યારે પણ, મહિનાઓ સુધી લાઇનો અને સહીઓ.","વધુ સ્પષ્ટ, જોકે વસિયતને હજુ પણ પડકારી શકાય છે.","ખાનગી અને શાંત, પણ તે માટે સમયસર ટ્રસ્ટ બનાવવું પડે."]],"endingsNote":"આ ફક્ત ઉદાહરણ છે, વચન નથી. વારસાની પ્રક્રિયામાં કેટલો સમય લાગે તેનો કોઈ સત્તાવાર આંકડો નથી; આ સમયગાળા આ ક્ષેત્રમાં કામ કરતા વ્યાવસાયિકોના અનુભવ પરથી છે, અને ખરો સમય પરિવાર, રકમ અને સંસ્થાઓ પર આધાર રાખે છે. ટ્રસ્ટ કેટલાક પરિવારો માટે યોગ્ય હોય છે અને કેટલાક માટે નહીં, અને પેન્શન તથા પ્રોવિડન્ટ ફંડ જેવી કેટલીક વસ્તુઓ ટ્રસ્ટમાં મૂકી શકાતી નથી.","folderTitle":"તમારું પોતાનું ફોલ્ડર","folderBrief":"ખોટ પછી ઘણા પરિવારો જે સૌથી પ્રેમાળ કામ કરે છે, તે એ ખાતરી કરવાનું કે હવે પછીની વખતે બધું વધુ સરળ બને. એમાં ફક્ત એક બપોર લાગે છે.","folder":["દરેક ખાતા અને પોલિસીમાં નોમિની. બેંકો હવે એક ડિપોઝિટ પર ચાર સુધી નોમિની રાખવા દે છે.","એક વસિયત, ભલે સાદી હોય, અને શક્ય હોય તો નોંધાયેલી.","બધું ક્યાં છે તેની એક યાદી: ખાતાં, પોલિસીઓ, રોકાણો, મિલકત, અને જાણકાર લોકોનો સંપર્ક કેવી રીતે કરવો.","ફોલ્ડર ક્યાં રાખ્યું છે, તે એક વ્યક્તિને જણાવી રાખો."],"helpTitle":"જો તમે ઇચ્છો કે કોઈ તમારી સાથે રહે","help":"કેટલાક પરિવારોને અત્યારે કાગળકામમાં મદદ જોઈએ છે; તો કેટલાક ઇચ્છે છે કે તેમના પોતાના પરિવારને ક્યારેય આ પાનાની જરૂર ન પડે. બંને સંજોગોમાં, અમને વાત કરવામાં આનંદ થશે, શાંતિથી અને કોઈ બંધન વગર.","closing":"આમાંનું કશું કોઈની ભૂલ વિશે નથી. મોટા ભાગના લોકો પોતાના કાગળો વ્યવસ્થિત કરવાનું વિચારે જ છે, અને હંમેશાં એવું લાગે છે કે હજુ સમય છે."},"letters":[{"id":"bank","title":"બેંકને અવસાનની જાણ કરવી","body":"પ્રતિ શ્રી શાખા મેનેજર,\n{inst}\n\nવિષય: {name} ના અવસાનની જાણ, ખાતા નંબર {ref}\n\nમાનનીય સાહેબશ્રી/મેડમશ્રી,\n\nઆ પત્ર દ્વારા આપને જાણ કરું છું કે આપની શાખામાં જેમના નામે ઉપરોક્ત ખાતું છે, તે {name} નું {date} ના રોજ અવસાન થયું છે. મરણ પ્રમાણપત્રની નકલ આ સાથે સામેલ છે.\n\nઆપને નમ્ર વિનંતી છે કે આપના રેકોર્ડમાં આ બાબતની નોંધ કરશો, ખાતા પરના તમામ વ્યવહારો, સ્ટેન્ડિંગ ઇન્સ્ટ્રક્શન અને ઓટો ડેબિટ બંધ કરશો, અને ખાતાની બાકી રકમ, કોઈ ફિક્સ્ડ ડિપોઝિટ, તથા કોઈ લોકર હોય તો તેની અંદરની વસ્તુઓ માટે દાવો કરવાની પ્રક્રિયા અને જરૂરી દસ્તાવેજો વિશે મને જાણ કરશો.\n\n{name} સાથે મારો સંબંધ {rel} તરીકેનો છે, અને મારો સંપર્ક {phone} પર થઈ શકે છે.\n\nઆ કઠિન સમયમાં આપની મદદ બદલ આભાર.\n\nઆપનો/આપની વિશ્વાસુ,\n{you}\nતારીખ: {today}\n\nબિડાણ: મરણ પ્રમાણપત્રની નકલ"},{"id":"insurance","title":"જીવન વીમાનો દાવો કરવો","body":"પ્રતિ દાવા વિભાગ (Claims Department),\n{inst}\n\nવિષય: પોલિસી નંબર {ref} હેઠળ અવસાન દાવો (death claim), વીમાધારક {name}\n\nમાનનીય સાહેબશ્રી/મેડમશ્રી,\n\nઆ પત્ર દ્વારા હું ઉપરોક્ત પોલિસી હેઠળ દાવો રજૂ કરું છું. વીમાધારક {name} નું {date} ના રોજ અવસાન થયું છે.\n\n{name} સાથે મારો સંબંધ {rel} તરીકેનો છે. આ સાથે દાવા ફોર્મ, મરણ પ્રમાણપત્ર, પોલિસી દસ્તાવેજ, મારું ઓળખપત્ર અને સરનામાનો પુરાવો, તથા ચુકવણી માટે રદ કરેલો ચેક સામેલ છે.\n\nબીજું કંઈ પણ જરૂરી હોય, તો કૃપા કરીને મને જણાવશો. મારો સંપર્ક {phone} પર થઈ શકે છે.\n\nઆપની મદદ બદલ આભાર.\n\nઆપનો/આપની વિશ્વાસુ,\n{you}\nતારીખ: {today}"},{"id":"late","title":"વીમા દાવામાં વિલંબનું કારણ સમજાવવું","body":"પ્રતિ દાવા વિભાગ (Claims Department),\n{inst}\n\nવિષય: પોલિસી નંબર {ref} હેઠળ અવસાન દાવો (death claim), વીમાધારક {name}, અને વિલંબનું કારણ\n\nમાનનીય સાહેબશ્રી/મેડમશ્રી,\n\n{name} નું {date} ના રોજ અવસાન થયું છે. આ દાવો સામાન્ય કરતાં મોડો આપના સુધી પહોંચે છે, તે બદલ હું દિલગીર છું: અમારો પરિવાર તેમના કાગળો તપાસી રહ્યો હતો ત્યારે, હમણાં જ આ પોલિસી ધ્યાનમાં આવી   // ── small helpers ──
  function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms || 1800); }
  function copy(text) {
    const ok = () => toast(C.ui.copied);
    const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback();
  }
  function share(text) { if (navigator.share) navigator.share({ text }).catch(() => {}); else window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener'); }
  const link = id => location.origin + location.pathname + (lang !== 'en' ? '?lang=' + lang : '') + '#' + id;
  const today = () => new Date().toLocaleDateString(lang === 'en' ? 'en-IN' : lang + '-IN', { day: 'numeric', month: 'long', year: 'numeric' });
  function filled(tpl, html) {
    const f = C.ui.fields, vals = Object.assign({ today: today() }, F);
    return String(tpl).replace(/\{(\w+)\}/g, (m, k) => {
      if (vals[k]) return html ? esc(vals[k]) : vals[k];
      const hint = '[' + (f[k] || k) + ']';
      return html ? `<span class="ph">${esc(hint)}</span>` : hint;
    });
  }
  const tilesFor = () => C.stages[3].cards.map((c, i) => ({ c, i })).filter(x => x.c.for.some(a => papers.assets.includes(a)));
  function progress(i) {
    const s = C.stages[i];
    if (s.cards) { const t = tilesFor(); return { d: t.filter(x => claimed[x.i]).length, n: t.length }; }
    const d = done[s.id] || {}; return { d: s.steps.filter((x, k) => d[k]).length, n: s.steps.length };
  }

  // ── chrome ──
  function chrome() {
    const u = C.ui;
    document.documentElement.lang = lang;
    document.title = u.title + ' · Draft';

    $('#draft').textContent = 'Draft';
    $('#draft').title = u.draft;
    const where = view === 'toolkit' ? 'toolkit' : 'journey';
    const tabs = [['journey', u.navJourney, 'path'], ['toolkit', u.navToolkit, 'kit']];
    $('#tabs-top').innerHTML = tabs.map(([k, t, i]) => `<button type="button" data-nav="${k === 'journey' ? 'home' : 'toolkit'}" ${where === k ? 'aria-current="page"' : ''}>${ic(i)}${esc(t)}</button>`).join('');
    $('#tabbar').innerHTML = tabs.map(([k, t, i]) => `<button type="button" data-nav="${k === 'journey' ? 'home' : 'toolkit'}" ${where === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${esc(t)}</span></button>`).join('');
    $('#langbtn').innerHTML = ic('globe') + `<span>${esc(DATA[lang].langName)}</span>`;
    $('#langbtn').setAttribute('aria-label', u.language);
    $('#langmenu').innerHTML = ORDER.map(l => `<button type="button" role="menuitemradio" data-lang="${l}" aria-checked="${l === lang}">${esc(DATA[l].langName)}${l === lang ? ic('check') : ''}</button>`).join('');
    const n = $('#tnote'); n.hidden = !u.translationNote; n.textContent = u.translationNote || '';
  }

  // ── home: the journey, and the toolkit one tap away ──
  function homeView() {
    const u = C.ui, at = store.get('at', null);
    const started = at !== null;
    const rows = C.stages.map((s, i) => {
      const p = progress(i), full = p.n && p.d === p.n;
      const pg = s.cards && !p.n ? '' : (full ? `<span class="done-badge">${ic('check')}${esc(fmt(u.progress, p))}</span>` : (p.d ? esc(fmt(u.progress, p)) : ''));
      return `<li><button class="partrow ${started && at === i ? 'now' : ''}" type="button" data-go="${i}">${thumb(PHOTO[i])}
        <span><span class="when">${esc(s.when)}</span><span class="t">${esc(s.title)}</span>${pg ? `<span class="pg">${pg}</span>` : ''}</span>${ic('chev', 'chev')}</button></li>`;
    }).join('') + `<li><button class="partrow" type="button" data-go="5">${thumb('ahead')}<span><span class="when">${esc(C.ahead.when)}</span><span class="t">${esc(C.ahead.title)}</span></span>${ic('chev', 'chev')}</button></li>`;
    const resume = started && at > 0 && at < 5;
    return `<div class="view">
      <section class="hero">${img('home')}<div class="over"><div class="col"><h1>${esc(u.title)}</h1><p class="sub">${esc(u.kicker)}</p></div></div></section>

          ${resume ? `<button class="btn" type="button" data-go="${at}">${esc(u.carryOn)}: ${esc(C.stages[at].title)} ${ic('arrow')}</button><button class="btn quiet sm" type="button" data-go="0">${esc(u.startOver)}</button>`
                   : `<button class="btn" type="button" data-go="0">${esc(u.begin)} ${ic('arrow')}</button>`}
        </div>
        <div class="sect-h"><h2>${esc(u.journeyTitle)}</h2></div>
        <p class="sect-p">${esc(u.journeyBrief)}</p>
        <ol class="parts">${rows}</ol>
        <button class="partrow kitrow" type="button" data-nav="toolkit">${thumb('toolkit')}<span><span class="t">${esc(u.toolkitTitle)}</span><span class="pg">${esc(u.toolkitBrief)}</span></span>${ic('chev', 'chev')}</button>
        <p class="foot">${esc(u.footer)} ${esc(u.photos)}</p>

  }

  // ── a part of the journey ──
  function meter(i) {
    return `<div class="meter" role="group" aria-label="${esc(fmt(C.ui.partOf, { n: i + 1 }))}">${C.stages.map((s, k) =>
      `<button type="button" class="${k < i ? 'on' : ''} ${k === i ? 'here' : ''}" data-go="${k}" aria-label="${esc(s.title)}" ${k === i ? 'aria-current="step"' : ''}></button>`).join('')}</div>`;
  }
  function toolButtons(tools) {
    const u = C.ui;
    return tools.map(t => {
      if (t === 'assets') return `<button class="btn soft sm" type="button" data-sheet="assets">${ic('papers')}${esc(u.pickHad)}</button>`;
      const [kind, id] = t.split(':');
      if (kind === 'letter') { const l = C.letters.find(x => x.id === id); return `<button class="btn soft sm" type="button" data-sheet="letter:${id}">${ic('letter')}${esc(tools.filter(x => x.startsWith('letter:')).length > 1 ? l.title : u.writeLetter)}</button>`; }
      if (kind === 'phone') return `<button class="btn ghost sm" type="button" data-sheet="phone:${id}">${ic('phone')}${esc(u.whatToSay)}</button>`;
      return '';
    }).join('');
  }
  function stepsList(s) {
    const d = done[s.id] || {}, u = C.ui, o = open[s.id] || {};
    return `<div class="card list">${s.steps.map((st, k) => `
      <div class="item ${d[k] ? 'is-done' : ''} ${o[k] ? 'open' : ''}" data-k="${k}">
        <div class="item-h">
          <button class="tick" type="button" data-tick="${k}" aria-pressed="${!!d[k]}" aria-label="${esc(u.done)}: ${esc(st.t)}">${ic('check')}</button>
          <button class="item-t" type="button" data-open="${k}" aria-expanded="${!!o[k]}">${esc(st.t)}</button>
          <button class="item-x" type="button" data-open="${k}" aria-label="${esc(u.details)}">${ic('down')}</button>
        </div>
        <div class="item-b"><p>${esc(st.d)}</p>

        </div>
      </div>`).join('')}</div>`;
  }
  function claimTiles() {
    const u = C.ui, t = tilesFor();
    if (!t.length) return `<div class="card empty"><p>${esc(u.chooseFirst)}</p><button class="btn soft" type="button" data-sheet="assets">${ic('papers')}${esc(u.pickHad)}</button></div>`;
    return `<p class="sect-p" style="margin:18px 0 0;font-weight:600;color:var(--ink)">${esc(u.basedOn)}</p><div class="tiles">${t.map(({ c, i }) => `
      <button class="tile" type="button" data-sheet="card:${i}"><b>${esc(c.h)}</b>${claimed[i] ? `<span class="pill ok">${ic('check')}${esc(u.claimed)}</span>` : `<span class="pill">${esc(u.toDo)}</span>`}</button>`).join('')}
      <button class="tile add" type="button" data-sheet="assets">${ic('plus')}${esc(u.addMore)}</button></div>`;

  function partView(i) {

    return `<div class="view">
      <section class="hero part">${img(PHOTO[i])}<div class="over"><div class="col"><div class="chips"><span class="chip">${esc(s.when)}</span><span class="chip">${esc(fmt(u.partOf, { n: i + 1 }))}</span></div><h2 tabindex="-1">${esc(s.title)}</h2></div></div></section>

        ${meter(i)}
        <p class="brief">${esc(s.brief)}</p>

        ${s.steps.length ? stepsList(s) : ''}
        ${s.cards ? claimTiles() : ''}
        ${s.closing ? `<p class="closing">${esc(s.closing)}</p>` : ''}
        <div class="qs"><h3>${esc(u.questions)}</h3>${s.qs.map(q => `<details class="q"><summary>${esc(q.q)}</summary><div><p>${esc(q.a)}</p></div></details>`).join('')}</div>
        <div class="next">
          <button class="btn quiet" type="button" data-pause="${i}">${esc(u.notToday)}</button>
          <button class="btn" type="button" data-go="${i + 1}">${esc(last ? u.nextLast : u.next)} ${ic('arrow')}</button>
        </div>
      </div></div>`;
  }
  function aheadView() {
    const u = C.ui, A = C.ahead;
    return `<div class="view">
      <section class="hero part">${img('ahead')}<div class="over"><div class="col"><div class="chips"><span class="chip">${esc(A.when)}</span></div><h2 tabindex="-1">${esc(A.title)}</h2></div></div></section>

      </div>
