        <thead><tr><th scope="col"></th>${A.cols.map((c, k) => `<th scope="col" class="${k === 0 ? 'first' : ''}">${esc(c)}<small>${esc(A.colNotes[k])}</small></th>`).join('')}</tr></thead>
        <tbody>${A.rows.map(r => `<tr><th scope="row">${esc(r[0])}</th>${r.slice(1).map((c, k) => `<td class="${k === 0 ? 'first' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div>
      <div class="col">
        <p class="note" style="margin-top:12px">${esc(A.endingsNote)}</p>
        <div class="sect-h"><h2>${esc(A.folderTitle)}</h2></div><p class="sect-p">${esc(A.folderBrief)}</p>
        <ol class="folder card">${A.folder.map(f => `<li>${esc(f)}</li>`).join('')}</ol>
        <p class="closing">${esc(A.closing)}</p>
        <div class="card help"><h3>${esc(A.helpTitle)}</h3><p style="margin:10px 0 0">${esc(A.help)}</p></div>
        <details class="q sources"><summary>${esc(u.sourcesTitle)}</summary><div><ul>${C.sources.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div></details>
        <div class="next"><button class="btn ghost" type="button" data-nav="home">${ic('back')} ${esc(u.navJourney)}</button><button class="btn soft" type="button" data-print="all">${ic('print')}${esc(u.print)}</button></div>
        <p class="foot">${esc(u.footer)} ${esc(u.photos)}</p>
      </div></div>`;
  }

  // ── the toolkit ──
  function fieldsBlock() {
    const f = C.ui.fields;
    return `<div class="fields">${['name', 'date', 'rel', 'you', 'inst', 'ref', 'phone'].map(k =>
      `<label>${esc(f[k])}<input type="${k === 'phone' ? 'tel' : 'text'}" data-f="${k}" value="${esc(F[k] || '')}" autocomplete="off" /></label>`).join('')}</div>`;
  }
  function papersList() {
    const P = C.papers, out = [];
    if (!papers.assets.length) return null;
    out.push([C.ui.papersForAll, P.forAll]);
    if (papers.nominee !== 'yes') out.push([C.ui.papersHeirs, P.heirs]);
    if (papers.will === 'yes') out.push([C.ui.papersWillDocs, P.will]);
    P.assets.filter(a => papers.assets.includes(a.id)).forEach(a => out.push([a.label, a.items]));
    return out;
  }
  const papersOut = () => { const L = papersList(); return L ? L.map(([h, it]) => `<h4>${esc(h)}</h4><ul>${it.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('') : `<p class="note" style="margin:0">${esc(C.ui.papersEmpty)}</p>`; };
  const papersText = () => { const L = papersList(); return L ? C.ui.papersOut + '\n\n' + L.map(([h, it]) => h + '\n' + it.map(x => '  - ' + x).join('\n')).join('\n\n') : ''; };
  function assetChips() {
    return `<div class="assetchips">${C.papers.assets.map(a => { const on = papers.assets.includes(a.id); return `<button class="achip" type="button" data-asset="${a.id}" aria-pressed="${on}">${on ? ic('check') : ic('plus')}${esc(a.label)}</button>`; }).join('')}</div>`;
  }
  function segQ(key, label) {
    const u = C.ui;
    return `<div class="q-label">${esc(label)}</div><div class="seg mini" data-seg="${key}">${[['yes', u.yes], ['no', u.no], ['unsure', u.notSure]].map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${papers[key] === v}">${esc(t)}</button>`).join('')}</div>`;
  }
  function toolkitView() {
    const u = C.ui;
    const tabs = [['letters', u.tabLetters], ['calls', u.tabCalls], ['papers', u.tabPapers], ['questions', u.tabQuestions]];
    let body = '';
    if (tkTab === 'letters') body = `<p class="sect-p">${esc(u.lettersBrief)}</p>
      <div class="card rowlist">${C.letters.map(l => `<button class="rowbtn" type="button" data-sheet="letter:${l.id}"><span class="ic">${ic('letter')}</span><b>${esc(l.title)}</b>${ic('chev', 'chev')}</button>`).join('')}</div>`;
    if (tkTab === 'calls') body = `<p class="sect-p">${esc(u.phoneBrief)}</p>${C.phone.map(p => `<div class="card callcard"><h3>${esc(p.title)}</h3><ol class="script">${p.lines.map(l => `<li>${filled(esc(l), true)}</li>`).join('')}</ol></div>`).join('')}`;
    if (tkTab === 'papers') body = `<p class="sect-p">${esc(u.papersBrief)}</p><div class="card" style="padding:18px 20px">
      <div class="q-label" style="margin-top:0">${esc(u.papersHad)}</div>${assetChips()}${segQ('nominee', u.papersNominee)}${segQ('will', u.papersWill)}</div>
      <div class="card out" id="papers-out">${papersOut()}</div>
      <div class="row" style="margin-top:12px"><button class="btn soft sm" type="button" data-papers="print">${ic('print')}${esc(u.print)}</button><button class="btn ghost sm" type="button" data-papers="copy">${ic('copy')}${esc(u.copy)}</button><button class="btn ghost sm" type="button" data-papers="share">${ic('share')}${esc(u.share)}</button></div>`;
    if (tkTab === 'questions') body = C.stages.map(s => `<div class="qgroup"><h3>${esc(s.title)}</h3>${s.qs.map(q => `<details class="q"><summary>${esc(q.q)}</summary><div><p>${esc(q.a)}</p></div></details>`).join('')}</div>`).join('');
    return `<div class="view">
      <section class="hero short">${img('toolkit')}<div class="over"><div class="col"><h2 tabindex="-1">${esc(u.toolkitTitle)}</h2></div></div></section>
      <div class="col"><p class="brief" style="margin-bottom:0">${esc(u.toolkitBrief)}</p>
        <div class="seg" role="tablist">${tabs.map(([k, t]) => `<button type="button" role="tab" data-tk="${k}" aria-pressed="${tkTab === k}">${esc(t)}</button>`).join('')}</div>
        <div id="tk">${body}</div>
        <p class="foot" style="margin-top:40px">${esc(u.footer)}</p>
      </div></div>`;
  }
  function pausedView() {
    const u = C.ui;
    return `<div class="view paused"><div><h2 tabindex="-1" style="font-size:2.2rem">${esc(u.pausedTitle)}</h2><p>${esc(u.pausedBody)}</p>
      <button class="btn ghost" type="button" data-go="${store.get('at', 0)}">${esc(u.pausedReturn)}</button></div></div>`;
  }

  // ── sheets: one at a time, slide up on a phone ──
  function openSheet(kind) {
    const u = C.ui;
    let title = '', body = '';
    if (kind === 'assets') {
      title = u.papersHad;
      body = `${assetChips()}<div class="acts"><button class="btn" type="button" data-close>${esc(u.done)}</button></div>`;
    } else if (kind.startsWith('letter:')) {
      const l = C.letters.find(x => x.id === kind.slice(7));
      title = l.title;
      body = `<p class="note" style="margin:0 0 4px">${esc(u.lettersBrief)}</p><div class="card" style="margin-top:10px">${fieldsBlock()}</div>
        <div class="lettertext" data-tpl="${l.id}">${filled(esc(l.body), true)}</div>
        <div class="acts"><button class="btn" type="button" data-copy-letter="${l.id}">${ic('copy')}${esc(u.copy)}</button><button class="btn ghost" type="button" data-close>${esc(u.close)}</button></div>`;
    } else if (kind.startsWith('phone:')) {
      const p = C.phone.find(x => x.id === kind.slice(6));
      title = p.title;
      body = `<p class="note" style="margin:0 0 10px">${esc(u.phoneBrief)}</p><ol class="script" data-script="${p.id}">${p.lines.map(l => `<li>${filled(esc(l), true)}</li>`).join('')}</ol>
        <div class="acts"><button class="btn ghost" type="button" data-close>${esc(u.close)}</button></div>`;
    } else if (kind.startsWith('card:')) {
      const i = +kind.slice(5), c = C.stages[3].cards[i];
      title = c.h;
      body = `<dl>${c.rows.map(([t, v]) => `<dt>${esc(t)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
        ${c.tools.length ? `<div class="row" style="margin-top:18px">${toolButtons(c.tools)}</div>` : ''}
        <div class="acts"><button class="btn ${claimed[i] ? 'soft' : ''}" type="button" data-claim="${i}">${ic('check')}${esc(claimed[i] ? u.claimed : u.markClaimed)}</button><button class="btn ghost" type="button" data-close>${esc(u.close)}</button></div>`;
    }
    sheet.innerHTML = `<div class="sheet-h"><h3 id="sheet-title">${esc(title)}</h3><button class="xbtn" type="button" data-close aria-label="${esc(u.close)}">${ic('x')}</button></div><div class="sheet-b">${body}</div>`;
    sheet.dataset.kind = kind;
    if (!sheet.open) {
      if (sheet.showModal) sheet.showModal(); else sheet.setAttribute('open', '');
      history.pushState({ v: view, sheet: 1 }, '', location.href); sheetPushed = true;
    }
  }
  let sheetPushed = false;           // the sheet has its own history entry, so back closes it
  function closeSheet() { if (sheet.open) { if (sheet.close) sheet.close(); else { sheet.removeAttribute('open'); sheet.dispatchEvent(new Event('close')); } } }
  sheet.addEventListener('close', () => {
    if (sheetPushed) { sheetPushed = false; history.back(); }      // closed by X, swipe or Esc: drop its entry
    if (view === 3 || view === 'home') render(false);
  });
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  let drag = null;
  sheet.addEventListener('pointerdown', e => {
    if (innerWidth > 760 || !e.target.closest('.sheet-h') || e.target.closest('button')) return;
    drag = { y: e.clientY, dy: 0, id: e.pointerId }; sheet.setPointerCapture(e.pointerId); sheet.style.transition = 'none';
  });
  sheet.addEventListener('pointermove', e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); sheet.style.transform = `translateY(${drag.dy}px)`; });
  const endDrag = () => {
    if (!drag) return; const far = drag.dy > 90; drag = null;
    sheet.style.transition = 'transform .22s ease'; sheet.style.transform = '';
    if (far) closeSheet();
    setTimeout(() => { sheet.style.transition = ''; }, 240);
  };
  sheet.addEventListener('pointerup', endDrag); sheet.addEventListener('pointercancel', endDrag);

  // ── render and route: the back gesture steps back through the guide, your place on
  //    the journey is kept, and screens cross-fade where the browser supports it ──
  const key = v => (typeof v === 'number' ? 'p' + v : v);
  const hashFor = v => v === 'home' ? '' : '#' + (v === 'toolkit' ? 'toolkit' : v === 5 ? 'ahead' : v === 'paused' ? IDS[store.get('at', 0)] : IDS[v]);
  const scrolls = {};
  const fade = !reduce && 'startViewTransition' in document;
  if (fade) document.documentElement.classList.add('vt');
  function draw() {
    chrome();
    const u = C.ui;
    if (view === 'home') app.innerHTML = homeView();
    else if (view === 'toolkit') app.innerHTML = toolkitView();
    else if (view === 'paused') app.innerHTML = pausedView();
    else if (view === 5) app.innerHTML = aheadView();
    else app.innerHTML = partView(view);
    const where = view === 'toolkit' ? u.toolkitTitle : view === 5 ? C.ahead.title : typeof view === 'number' ? C.stages[view].title : '';
    document.title = (where ? where + ' · ' : '') + u.title;
    app.querySelectorAll('img').forEach(im => { if (im.complete && im.naturalWidth) im.classList.add('ld'); });
  }
  function render() { draw(); }
  function show(v, restore) {
    scrolls[key(view)] = window.scrollY;
    view = v;
    const run = () => {
      draw();
      window.scrollTo(0, restore ? (scrolls[key(v)] || 0) : 0);
      if (!restore) { const h = $('h2[tabindex]', app); if (h) h.focus({ preventScroll: true }); }
    };
    if (fade) document.startViewTransition(run); else run();
  }
  function go(to) {
    const v = (to === 'home' || to === 'toolkit' || to === 'paused') ? to : +to;
    if (typeof v === 'number' && v < 5) store.set('at', v);
    const state = { v }, url = location.pathname + location.search + hashFor(v);
    if (sheet.open) { sheetPushed = false; closeSheet(); history.replaceState(state, '', url); }
    else history.pushState(state, '', url);
    show(v, v === 'home');
  }
  window.addEventListener('popstate', e => {
    if (sheet.open) { sheetPushed = false; closeSheet(); return; }   // back gesture: its entry is already gone
    const v = e.state && e.state.v !== undefined ? e.state.v : fromHash();
    if (v !== view) show(v, true);
  });

  // ── print: everything, or just the papers list ──
  function printAll() {
    const u = C.ui, A = C.ahead;
    $('#print').innerHTML = `<h1>${esc(u.title)}</h1><p>${esc(u.kicker)}</p>` + C.stages.map((s, i) => `<section><p>${esc(s.when)} · ${esc(fmt(u.partOf, { n: i + 1 }))}</p><h2>${esc(s.title)}</h2><p><i>${esc(s.brief)}</i></p>
      ${(s.intro || []).map(p => `<p>${esc(p)}</p>`).join('')}${s.steps.length ? `<ol>${s.steps.map(st => `<li><b>${esc(st.t)}.</b> ${esc(st.d)}</li>`).join('')}</ol>` : ''}
      ${s.cards ? s.cards.map(c => `<h3>${esc(c.h)}</h3><ul>${c.rows.map(([t, v]) => `<li><b>${esc(t)}:</b> ${esc(v)}</li>`).join('')}</ul>`).join('') : ''}
      <h3>${esc(u.questions)}</h3>${s.qs.map(q => `<p><b>${esc(q.q)}</b><br>${esc(q.a)}</p>`).join('')}</section>`).join('') +
      `<section><h2>${esc(A.title)}</h2><table border="1" cellpadding="6" style="border-collapse:collapse"><tr><th></th>${A.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${A.rows.map(r => `<tr>${r.map((c, k) => k ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table>
      <h3>${esc(A.folderTitle)}</h3><ol>${A.folder.map(f => `<li>${esc(f)}</li>`).join('')}</ol>
      <h3>${esc(u.tabLetters)}</h3>${C.letters.map(l => `<h4>${esc(l.title)}</h4><pre style="white-space:pre-wrap;font:inherit">${esc(filled(l.body, false))}</pre>`).join('')}<p>${esc(u.footer)}</p></section>`;
    document.body.classList.remove('print-papers'); window.print();
  }
  function printPapers() { $('#print').innerHTML = `<div class="papers-only"><h1>${esc(C.ui.papersTitle)}</h1>${papersOut()}</div>`; document.body.classList.add('print-papers'); window.print(); }

  // ── events ──
  document.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) { if (!e.target.closest('#langmenu,#langbtn')) $('#langmenu').hidden = true; return; }
    if (t.id === 'langbtn') { const m = $('#langmenu'); m.hidden = !m.hidden; t.setAttribute('aria-expanded', !m.hidden); return; }
    if (t.dataset.lang) { lang = t.dataset.lang; C = DATA[lang]; store.set('lang', lang); $('#langmenu').hidden = true; const k = sheet.open && sheet.dataset.kind; render(false); if (k) openSheet(k); return; }
    $('#langmenu').hidden = true;
    if (t.dataset.nav) return go(t.dataset.nav);
    if (t.dataset.go !== undefined) return go(+t.dataset.go);
    if (t.dataset.tk) { tkTab = t.dataset.tk; store.set('tab', tkTab); if (view !== 'toolkit') return go('toolkit'); render(false); return; }
    if (t.dataset.pause !== undefined) { store.set('at', +t.dataset.pause); return go('paused'); }
    if (t.dataset.open !== undefined) {
      const id = C.stages[view].id, k = t.dataset.open; open[id] = open[id] || {}; open[id][k] = !open[id][k];
      const it = t.closest('.item'); it.classList.toggle('open', open[id][k]); it.querySelector('.item-t').setAttribute('aria-expanded', open[id][k]);
      if (open[id][k]) requestAnimationFrame(() => { const r = it.getBoundingClientRect(); if (r.bottom > innerHeight - 90) it.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' }); });
      return;
    }
    if (t.dataset.tick !== undefined) {
      const s = C.stages[view], id = s.id, k = t.dataset.tick; done[id] = done[id] || {}; done[id][k] = !done[id][k]; store.set('done', done);
      const it = t.closest('.item'); it.classList.toggle('is-done', !!done[id][k]); t.setAttribute('aria-pressed', !!done[id][k]);
      if (done[id][k] && s.steps.every((x, j) => done[id][j])) toast(C.ui.partDone, 4200);
      return;
    }
    if (t.dataset.share !== undefined) { const s = C.stages[view], st = s.steps[+t.dataset.share]; return share(fmt(C.ui.shareText, { step: st.t, url: link(s.id) })); }
    if (t.dataset.sheet) return openSheet(t.dataset.sheet);
    if (t.dataset.close !== undefined) return closeSheet();
    if (t.dataset.claim !== undefined) {
      const i = t.dataset.claim; claimed[i] = !claimed[i]; store.set('claimed', claimed); openSheet('card:' + i);
      const all = tilesFor(); if (claimed[i] && all.length && all.every(x => claimed[x.i])) toast(C.ui.partDone, 4200);
      return;
    }
    if (t.dataset.copyLetter) { const l = C.letters.find(x => x.id === t.dataset.copyLetter); return copy(filled(l.body, false)); }
    if (t.dataset.asset) {
      const a = t.dataset.asset, on = !papers.assets.includes(a);
      papers.assets = papers.assets.filter(x => x !== a); if (on) papers.assets.push(a); store.set('papers', papers);
      t.setAttribute('aria-pressed', on); t.innerHTML = (on ? ic('check') : ic('plus')) + esc(C.papers.assets.find(x => x.id === a).label);
      const o = $('#papers-out'); if (o) o.innerHTML = papersOut();
      return;
    }
    const seg = t.closest('[data-seg]');
    if (seg) { papers[seg.dataset.seg] = t.dataset.v; store.set('papers', papers); seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t)); const o = $('#papers-out'); if (o) o.innerHTML = papersOut(); return; }
    if (t.dataset.papers === 'copy') return copy(papersText());
    if (t.dataset.papers === 'share') return share(papersText() + '\n\n' + link('toolkit'));
    if (t.dataset.papers === 'print') return printPapers();
    if (t.dataset.print === 'all') return printAll();
  });
  document.addEventListener('input', e => {
    const k = e.target.dataset && e.target.dataset.f; if (!k) return;
    F[k] = e.target.value;
    document.querySelectorAll(`input[data-f="${k}"]`).forEach(x => { if (x !== e.target) x.value = F[k]; });
    document.querySelectorAll('[data-tpl]').forEach(el => { const l = C.letters.find(x => x.id === el.dataset.tpl); el.innerHTML = filled(esc(l.body), true); });
    document.querySelectorAll('[data-script]').forEach(el => { const p = C.phone.find(x => x.id === el.dataset.script); el.innerHTML = p.lines.map(l => `<li>${filled(esc(l), true)}</li>`).join(''); });
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#langmenu').hidden = true; });
  window.addEventListener('afterprint', () => document.body.classList.remove('print-papers'));

  // ── start: a shared link opens its part; otherwise the journey home ──
  function fromHash() {
    const h = location.hash.slice(1);
    return h === 'toolkit' ? 'toolkit' : h === 'ahead' ? 5 : IDS.includes(h) ? IDS.indexOf(h) : 'home';
  }
  view = fromHash();
  if (typeof view === 'number') store.set('at', view);
  history.replaceState({ v: view }, '', location.href);
  draw();
})();
</script>
</body>
</html>
